<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tres cosenos muestreados — IEE2103</title>
<style>
  :root{ --ink:#16202e; --dim:#65758b; --line:#d9e0ea; --bg:#ffffff;
         --azul:#0072B2; --rojo:#D55E00; --acc:#6042a6; --ghost:#b9c4d2; --alias:#E69F00; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;max-width:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);
       font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  #app{height:100%;min-width:0;display:flex;flex-direction:column;padding:8px 14px;gap:6px;overflow:hidden}

  header{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
  .brand{font-weight:700;font-size:16px;white-space:nowrap;flex:0 0 auto}
  .brand span{font-weight:400;color:var(--dim);font-size:13px;margin-left:8px}
  .ctrls{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}
  button{font:inherit;color:var(--ink);background:#f2f5f9;border:1px solid var(--line);
         border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;font-size:14px}
  button:hover{background:#e7edf5}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.primary:hover{background:#7355c0}
  button.on{background:#fff3dc;border-color:var(--alias);color:#8a5a00;font-weight:600}
  label.sl{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;white-space:nowrap}
  input[type=range]{width:110px;max-width:26vw}
  .hint{color:var(--dim);font-size:13.5px;text-align:center;min-height:20px}
  .hint b{color:var(--acc)}
  .hint .ord{color:var(--rojo);font-weight:700}

  .rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
  figure{margin:0;position:relative;flex:1 1 0;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  figcaption{position:absolute;top:5px;left:10px;z-index:2;font-size:13px;color:var(--ink);
             background:rgba(255,255,255,.92);padding:1px 7px;border-radius:5px;pointer-events:none;font-variant-numeric:tabular-nums}
  figcaption .k{color:var(--dim)}
  figcaption .om{color:var(--azul);font-weight:700}
  figcaption .ap{color:#b07000;font-weight:700}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">Tres cosenos muestreados <span>IEE2103 · C20</span></div>
    <div class="ctrls">
      <button id="btnPlay" class="primary">▶ muestrear</button>
      <button id="btnReset">↺</button>
      <label class="sl">T <input type="range" id="slT" min="40" max="100" step="5" value="100"> <span id="rT">1,00 ms</span></label>
      <button id="btnOrig" class="on">original</button>
      <button id="btnApar">aparente</button>
      <button id="btnCirc" class="on">círculo</button>
    </div>
  </header>

  <div class="hint" id="hint"></div>

  <div class="rows">
    <figure><figcaption id="cap0"></figcaption><canvas id="c0"></canvas></figure>
    <figure><figcaption id="cap1"></figcaption><canvas id="c1"></canvas></figure>
    <figure><figcaption id="cap2"></figcaption><canvas id="c2"></canvas></figure>
  </div>

</div>

<script>
(function(){
'use strict';
const TAU = 2*Math.PI, PI = Math.PI;
const W_RAD = [3000, 4000, 5000];             // rad/s de cada coseno continuo
const NOMBRE = ['x₁', 'x₂', 'x₃'];
const TW = 12;                                 // ventana de tiempo, ms
const DUR_MS = 3600;                           // duración del muestreo animado, ms
const C = { azul:'#0072B2', rojo:'#D55E00', alias:'#E69F00', ghost:'#b9c4d2', ink:'#16202e', dim:'#65758b', line:'#d9e0ea' };

const p = new URLSearchParams(location.search);
let T = +(p.get('T') || 1);                    // ms
let verOrig = p.get('orig') !== '0';
let verApar = p.get('apar') === '1';
let verCirc = p.get('circ') !== '0';
let k = p.has('k') ? +p.get('k') : 0;          // muestras reveladas
let timer = null;

const cv = [0,1,2].map(i => document.getElementById('c'+i));
const cap = [0,1,2].map(i => document.getElementById('cap'+i));
const hint = document.getElementById('hint');
const slT = document.getElementById('slT'), rT = document.getElementById('rT');
const btnPlay = document.getElementById('btnPlay'), btnReset = document.getElementById('btnReset');
const btnOrig = document.getElementById('btnOrig'), btnApar = document.getElementById('btnApar'), btnCirc = document.getElementById('btnCirc');

const f2 = x => x.toFixed(2).replace('.', ',');
const nMax = () => Math.floor(TW/T + 1e-9) + 1;         // muestras que caben en la ventana
const omega = i => W_RAD[i]*T/1000;                      // Ω = ωT, rad/muestra
const omEq = om => ((om + PI) % TAU + TAU) % TAU - PI;   // equivalente en [−π, π)

function captions(){
  for (let i=0;i<3;i++){
    const om = omega(i), eq = omEq(om);
    let s = `${NOMBRE[i]}(t) = cos(${W_RAD[i]}·t) <span class="k">→ ${NOMBRE[i]}[n] = cos(<span class="om">${f2(om)}</span>·n)</span>`;
    if (verApar){
      s += (Math.abs(eq-om) < 1e-9)
        ? ` <span class="k">· ${f2(om)} ≤ π: se ve como</span> <span class="ap">${f2(Math.abs(eq))}</span>`
        : ` <span class="k">· ${f2(om)} ≡ ${f2(eq)} (−2π): se ve como</span> <span class="ap">${f2(Math.abs(eq))}</span>`;
    }
    cap[i].innerHTML = s;
  }
  rT.textContent = f2(T) + ' ms';
  const listo = k >= nMax();
  if (!listo && k === 0){
    hint.innerHTML = `En continuo suben de frecuencia: 3000, 4000, 5000 rad/s. <b>▶</b> las muestrea a la vez con T = ${f2(T)} ms. ¿Cuál oscila más lento?`;
  } else if (!listo){
    hint.innerHTML = `Muestreando… (${k} de ${nMax()})`;
  } else {
    const ord = [0,1,2].sort((a,b) => Math.abs(omEq(omega(a))) - Math.abs(omEq(omega(b))));
    hint.innerHTML = `De menor a mayor frecuencia discreta: <span class="ord">${ord.map(i => `${NOMBRE[i]} (${f2(Math.abs(omEq(omega(i))))})`).join(' &lt; ')}</span>` +
      (verApar ? '' : ' · <b>aparente</b> dibuja el coseno más lento que pasa por las mismas muestras');
  }
  btnOrig.classList.toggle('on', verOrig);
  btnApar.classList.toggle('on', verApar);
  btnCirc.classList.toggle('on', verCirc);
  btnPlay.textContent = timer ? '❚❚ pausa' : (listo ? '▶ de nuevo' : '▶ muestrear');
}

function fitCanvas(c){
  const r = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(10, Math.round(r.width*dpr)), h = Math.max(10, Math.round(r.height*dpr));
  if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  const g = c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  return [g, r.width, r.height];
}

function pintaFila(i){
  const [g, W, H] = fitCanvas(cv[i]);
  g.clearRect(0,0,W,H);
  const om = omega(i), eq = omEq(om);
  const circD = verCirc ? Math.min(H - 10, 150) : 0;
  const padL = 30, padR = 12 + (verCirc ? circD + 16 : 0), padT = 26, padB = 18;
  const x0 = padL, x1 = W - padR, ymid = padT + (H - padT - padB)/2, A = (H - padT - padB)/2 * 0.9;
  const X = tms => x0 + (x1 - x0) * tms / TW;
  const Y = v => ymid - A*v;

  // eje y ticks
  g.strokeStyle = C.line; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x0, ymid); g.lineTo(x1, ymid); g.stroke();
  g.fillStyle = C.dim; g.font = '11px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'top';
  for (let t=0; t<=TW; t++){
    g.beginPath(); g.moveTo(X(t), ymid-3); g.lineTo(X(t), ymid+3); g.stroke();
    if (t % 2 === 0) g.fillText(t === TW ? `${t} ms` : `${t}`, X(t), ymid + A + 4);
  }
  g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillText('1', x0 - 5, Y(1)); g.fillText('−1', x0 - 5, Y(-1));

  // coseno continuo original
  if (verOrig){
    g.strokeStyle = C.ghost; g.lineWidth = 1.6; g.beginPath();
    const NP = 600;
    for (let j=0;j<=NP;j++){ const t = TW*j/NP; const v = Math.cos(W_RAD[i]*t/1000); j ? g.lineTo(X(t), Y(v)) : g.moveTo(X(t), Y(v)); }
    g.stroke();
  }
  // coseno aparente: el más lento que pasa por las mismas muestras
  if (verApar){
    g.strokeStyle = C.alias; g.lineWidth = 2; g.setLineDash([6,4]); g.beginPath();
    const NP = 600;
    for (let j=0;j<=NP;j++){ const t = TW*j/NP; const v = Math.cos(eq * t / T); j ? g.lineTo(X(t), Y(v)) : g.moveTo(X(t), Y(v)); }
    g.stroke(); g.setLineDash([]);
  }
  // muestras
  const n1 = Math.min(k, nMax());
  for (let n=0; n<n1; n++){
    const t = n*T; if (t > TW + 1e-9) break;
    const v = Math.cos(om*n);
    g.strokeStyle = C.azul; g.lineWidth = 2;
    g.beginPath(); g.moveTo(X(t), ymid); g.lineTo(X(t), Y(v)); g.stroke();
    g.fillStyle = C.azul; g.beginPath(); g.arc(X(t), Y(v), 4, 0, TAU); g.fill();
  }

  // círculo: el fasor que salta
  if (verCirc){
    const r = circD/2 - 14, cx = W - 12 - circD/2, cy = padT - 8 + (H - padT - padB + 8)/2;
    const P = th => [cx + r*Math.cos(th), cy - r*Math.sin(th)];
    g.strokeStyle = C.line; g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke();
    g.beginPath(); g.moveTo(cx - r - 4, cy); g.lineTo(cx + r + 4, cy); g.moveTo(cx, cy - r - 4); g.lineTo(cx, cy + r + 4); g.stroke();
    g.fillStyle = C.dim; g.font = '10px system-ui, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'bottom';
    g.fillText('Re', cx + r + 5, cy - 1);
    // puntos ya pisados
    for (let n=0; n<n1; n++){
      const [px, py] = P(om*n);
      g.fillStyle = n === n1-1 ? C.azul : '#8fb8d8';
      g.beginPath(); g.arc(px, py, n === n1-1 ? 4.5 : 3, 0, TAU); g.fill();
    }
    const arco = (th0, dth, color, rr) => {
      g.strokeStyle = color; g.lineWidth = 2.5; g.beginPath();
      const NS = 40;
      for (let j=0;j<=NS;j++){ const th = th0 + dth*j/NS; const px = cx + rr*Math.cos(th), py = cy - rr*Math.sin(th); j ? g.lineTo(px,py) : g.moveTo(px,py); }
      g.stroke();
      // punta de flecha
      const thE = th0 + dth, s = Math.sign(dth);
      const ex = cx + rr*Math.cos(thE), ey = cy - rr*Math.sin(thE);
      const tx = -Math.sin(thE)*s, ty = -Math.cos(thE)*s;   // tangente en sentido del avance (canvas)
      g.fillStyle = color; g.beginPath();
      g.moveTo(ex + tx*7, ey + ty*7);
      g.lineTo(ex - ty*4, ey + tx*4); g.lineTo(ex + ty*4, ey - tx*4); g.closePath(); g.fill();
    };
    if (n1 >= 2){
      const th0 = om*(n1-2);
      arco(th0, om, C.azul, r*0.72);                 // el salto Ω hacia adelante
      if (verApar && Math.abs(eq-om) > 1e-9) arco(th0, eq, C.alias, r*0.5);  // el salto equivalente, por el otro lado
      // radio al último punto
      const [px, py] = P(om*(n1-1));
      g.strokeStyle = C.azul; g.lineWidth = 1.2; g.beginPath(); g.moveTo(cx, cy); g.lineTo(px, py); g.stroke();
    }
    g.fillStyle = C.azul; g.font = 'bold 12px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'top';
    g.fillText(`salto ${f2(om)}`, cx, cy + r + 6);
    if (verApar && Math.abs(eq-om) > 1e-9){ g.fillStyle = '#b07000'; g.textBaseline = 'bottom'; g.fillText(`≡ ${f2(eq)}`, cx, cy - r - 5); }
  }
}

function pinta(){ captions(); for (let i=0;i<3;i++) pintaFila(i); }

function play(){
  if (timer){ clearInterval(timer); timer = null; captions(); return; }
  if (k >= nMax()) k = 0;
  const paso = Math.max(60, DUR_MS / nMax());
  timer = setInterval(() => {
    k++; if (k >= nMax()){ k = nMax(); clearInterval(timer); timer = null; }
    pinta();
  }, paso);
  pinta();
}
function reset(){ if (timer){ clearInterval(timer); timer = null; } k = 0; pinta(); }
function setT(ms){ T = Math.min(1, Math.max(0.4, ms)); slT.value = Math.round(T*100); if (k > 0) k = nMax(); pinta(); }

btnPlay.addEventListener('click', play);
btnReset.addEventListener('click', reset);
btnOrig.addEventListener('click', () => { verOrig = !verOrig; pinta(); });
btnApar.addEventListener('click', () => { verApar = !verApar; pinta(); });
btnCirc.addEventListener('click', () => { verCirc = !verCirc; pinta(); });
slT.addEventListener('input', () => setT(+slT.value/100));
slT.value = Math.round(T*100);

document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const key = e.key;
  if (key === ' '){ e.preventDefault(); play(); }
  else if (key === 'o' || key === 'O'){ verOrig = !verOrig; pinta(); }
  else if (key === 'a' || key === 'A'){ verApar = !verApar; pinta(); }
  else if (key === 'c' || key === 'C'){ verCirc = !verCirc; pinta(); }
  else if (key === 'r' || key === 'R'){ reset(); }
  else if (key === 'ArrowLeft'){ e.preventDefault(); setT(T - 0.05); }
  else if (key === 'ArrowRight'){ e.preventDefault(); setT(T + 0.05); }
  else return;
  e.stopPropagation();
});

window.addEventListener('resize', pinta);
if (window.ResizeObserver){ const ro = new ResizeObserver(() => pinta()); cv.forEach(c => ro.observe(c.parentElement)); }
pinta();   // primer cuadro sin depender de requestAnimationFrame
if (p.get('auto') === '1') play();
})();
</script>
</body>
</html>
