<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analizador de espectro en vivo — IEE2103</title>
<style>
  :root{
    --bg:#0d1117; --panel:#111826; --line:#243044; --ink:#e8eef7; --dim:#8ea0bb;
    --acc:#4cc2ff; --acc2:#ffd166; --warn:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{height:100%;display:flex;flex-direction:column;padding:10px 12px;gap:8px}

  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:17px;white-space:nowrap}
  .brand span{font-weight:400;color:var(--dim);font-size:13px;margin-left:8px}
  .ctrls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  button,select{
    font:inherit;color:var(--ink);background:#1b2436;border:1px solid var(--line);
    border-radius:8px;padding:7px 12px;cursor:pointer
  }
  button:hover:not(:disabled),select:hover{border-color:#3c4d6b;background:#222e45}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--acc);border-color:var(--acc);color:#062033;font-weight:600}
  button.primary:hover{background:#6fcfff}
  button.on{background:var(--acc2);border-color:var(--acc2);color:#3a2c00;font-weight:600}
  button.ghost{background:transparent}

  #cfg{
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px
  }
  #cfg[hidden],#msg[hidden],#badge[hidden]{display:none}
  #cfg label{display:flex;align-items:center;gap:6px;color:var(--dim);white-space:nowrap}
  #cfg select{padding:4px 8px;font-size:13px}

  .msg{
    background:#2a1a1a;border:1px solid #6b2f2f;color:#ffd7d7;
    border-radius:10px;padding:10px 14px;font-size:14px
  }
  .msg code{background:#00000055;padding:2px 6px;border-radius:4px;font-size:13px}

  #readout{display:flex;align-items:baseline;gap:26px;flex-wrap:wrap;padding:0 2px}
  .ro{display:flex;align-items:baseline;gap:7px}
  .ro .lab{color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
  .ro .val{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .ro .unit{color:var(--dim);font-size:14px}
  #roN{color:var(--acc2)}
  #roCents{color:var(--dim);font-size:15px;font-weight:400}
  #badge{
    margin-left:auto;background:var(--acc2);color:#3a2c00;font-weight:700;letter-spacing:.1em;
    padding:5px 12px;border-radius:6px;font-size:13px
  }

  .panels{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
  .panel{
    margin:0;position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;min-height:70px
  }
  .panel:nth-child(1){flex:0.85}
  .panel:nth-child(2){flex:1.15}
  .panel:nth-child(3){flex:1.15}
  figcaption{
    position:absolute;top:5px;left:6px;z-index:2;color:var(--dim);
    font-size:13px;letter-spacing:.02em;pointer-events:none;
    background:rgba(17,24,38,.88);padding:2px 7px;border-radius:5px
  }
  canvas{display:block;width:100%;height:100%}
  .hint{color:var(--dim);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">Analizador de espectro en vivo <span>IEE2103 · Señales y Sistemas</span></div>
    <div class="ctrls">
      <button id="btnMic" class="primary">🎤 Activar micrófono</button>
      <button id="btnFreeze" disabled>❄ Congelar</button>
      <button id="btnPng" disabled>Guardar PNG</button>
      <button id="btnCfg" class="ghost">⚙ Ajustes</button>
    </div>
  </header>

  <div id="cfg" hidden>
    <label>Entrada
      <select id="selDev"><option value="">(por defecto)</option></select>
    </label>
    <label>Rango
      <select id="selFmax">
        <option value="2000">0–2 kHz</option>
        <option value="5000" selected>0–5 kHz</option>
        <option value="10000">0–10 kHz</option>
        <option value="0">0–Nyquist</option>
      </select>
    </label>
    <label>N (FFT)
      <select id="selFft">
        <option value="1024">1024</option>
        <option value="2048">2048</option>
        <option value="4096" selected>4096</option>
        <option value="8192">8192</option>
      </select>
    </label>
    <label>Ventana t
      <select id="selWin">
        <option value="5">5 ms</option>
        <option value="10">10 ms</option>
        <option value="20" selected>20 ms</option>
        <option value="50">50 ms</option>
      </select>
    </label>
    <label>Piso
      <select id="selFloor">
        <option value="-70">−70 dB</option>
        <option value="-85" selected>−85 dB</option>
        <option value="-100">−100 dB</option>
      </select>
    </label>
    <label><input type="checkbox" id="chkHarm" checked> armónicos</label>
    <label><input type="checkbox" id="chkPeak" checked> retención de picos</label>
    <label>Tono de prueba
      <select id="selTone">
        <option value="">(apagado)</option>
        <option value="sine">seno 440 Hz</option>
        <option value="flute">flauta sintética 440 Hz</option>
        <option value="saw">sierra 220 Hz</option>
      </select>
    </label>
  </div>

  <div id="msg" class="msg" hidden></div>

  <div id="readout">
    <div class="ro"><span class="lab">f₀</span><span id="roF" class="val">—</span><span class="unit">Hz</span></div>
    <div class="ro"><span class="lab">nota</span><span id="roN" class="val">—</span><span id="roCents"></span></div>
    <div class="ro"><span class="lab">nivel</span><span id="roL" class="val">—</span><span class="unit">dB</span></div>
    <div id="badge" hidden>CONGELADO</div>
  </div>

  <div class="panels">
    <figure class="panel"><figcaption>Tiempo — x(t)</figcaption><canvas id="cWave"></canvas></figure>
    <figure class="panel"><figcaption>Frecuencia — |X(f)| en dB</figcaption><canvas id="cSpec"></canvas></figure>
    <figure class="panel"><figcaption>Sonograma — frecuencia (vertical) vs. tiempo (→)</figcaption><canvas id="cSono"></canvas></figure>
  </div>

  <div class="hint">Teclas: <b>espacio</b> o <b>F</b> congela/reanuda (hay que hacer clic dentro de la demo primero) · <b>G</b> guarda PNG</div>
</div>

<script>
"use strict";

/* ───────── estado ───────── */
let audioCtx=null, analyser=null, micNode=null, micStream=null;
let toneNode=null, toneGain=null, toneLfo=null;
let timeBuf=null, freqBuf=null, peakBuf=null;
let running=false, frozen=false, raf=0;
let f0=0, level=-Infinity, waveScale=0.5;

const el = id => document.getElementById(id);
const cWave=el('cWave'), cSpec=el('cSpec'), cSono=el('cSono');

/* ───────── sonograma: buffer en anillo, independiente del tamaño en pantalla ───────── */
const SONO_W=1200, SONO_H=300;
const sono=document.createElement('canvas'); sono.width=SONO_W; sono.height=SONO_H;
const sctx=sono.getContext('2d',{willReadFrequently:false});
let sonoCol=0;
const colImg=sctx.createImageData(1,SONO_H);
function clearSono(){ sctx.fillStyle='#000004'; sctx.fillRect(0,0,SONO_W,SONO_H); sonoCol=0; }
clearSono();

/* colormap tipo «inferno» */
const CMAP=[[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[250,193,39],[252,255,164]];
function cmap(t){
  t = t<0?0 : t>1?1 : t;
  const x=t*(CMAP.length-1), i=Math.min(CMAP.length-2,Math.floor(x)), f=x-i;
  const a=CMAP[i], b=CMAP[i+1];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}

/* ───────── ajustes ───────── */
const cfg={ fmax:5000, fft:4096, winMs:20, floor:-85, harm:true, peak:true };
const TOP_DB=-10;                       // techo del eje vertical de dB

function nyquist(){ return audioCtx ? audioCtx.sampleRate/2 : 24000; }
function fmaxHz(){ return cfg.fmax>0 ? Math.min(cfg.fmax, nyquist()) : nyquist(); }
function binHz(){ return audioCtx ? audioCtx.sampleRate/cfg.fft : 1; }

/* ───────── audio ───────── */
function ensureCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    analyser = audioCtx.createAnalyser();
    applyFft();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function applyFft(){
  analyser.fftSize = cfg.fft;
  analyser.minDecibels = -110;
  analyser.maxDecibels = TOP_DB;
  analyser.smoothingTimeConstant = 0.55;
  timeBuf = new Float32Array(analyser.fftSize);
  freqBuf = new Float32Array(analyser.frequencyBinCount);
  peakBuf = new Float32Array(analyser.frequencyBinCount).fill(-200);
  clearSono();
}

async function startMic(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new DOMException('sin getUserMedia','NotSupportedError');
    }
    ensureCtx();
    stopTone();
    stopMic();
    const dev = el('selDev').value;
    micStream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false,
      channelCount:1, deviceId: dev ? {exact:dev} : undefined
    }});
    micNode = audioCtx.createMediaStreamSource(micStream);
    micNode.connect(analyser);           // el micrófono NO va a los parlantes (evita realimentación)
    hideMsg();
    listDevices();
    setRunning(true);
    el('btnMic').textContent='🎤 Micrófono activo';
    el('btnMic').classList.remove('primary');
  }catch(err){ showError(err); }
}
function stopMic(){
  if(micNode){ try{micNode.disconnect();}catch(e){} micNode=null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
}

function startTone(kind){
  ensureCtx();
  stopMic();
  stopTone();
  el('btnMic').textContent='🎤 Activar micrófono';
  el('btnMic').classList.add('primary');

  toneGain = audioCtx.createGain(); toneGain.gain.value = 0.14;
  toneNode = audioCtx.createOscillator();

  if(kind==='saw'){ toneNode.type='sawtooth'; toneNode.frequency.value=220; }
  else if(kind==='flute'){
    // flauta: fundamental dominante + pocos armónicos débiles, con vibrato suave
    const amp=[0,1,0.22,0.09,0.045,0.02];
    const real=new Float32Array(amp.length), imag=new Float32Array(amp);
    toneNode.setPeriodicWave(audioCtx.createPeriodicWave(real,imag,{disableNormalization:false}));
    toneNode.frequency.value=440;
    toneLfo = audioCtx.createOscillator(); toneLfo.frequency.value=5;
    const lg=audioCtx.createGain(); lg.gain.value=3;      // ±3 Hz ≈ ±12 cents
    toneLfo.connect(lg); lg.connect(toneNode.frequency); toneLfo.start();
  } else { toneNode.type='sine'; toneNode.frequency.value=440; }

  toneNode.connect(toneGain); toneGain.connect(analyser); toneGain.connect(audioCtx.destination);
  toneNode.start();
  hideMsg();
  setRunning(true);
}
function stopTone(){
  if(toneNode){ try{toneNode.stop();}catch(e){} try{toneNode.disconnect();}catch(e){} toneNode=null; }
  if(toneLfo){ try{toneLfo.stop();}catch(e){} try{toneLfo.disconnect();}catch(e){} toneLfo=null; }
  if(toneGain){ try{toneGain.disconnect();}catch(e){} toneGain=null; }
}

async function listDevices(){
  try{
    const devs = await navigator.mediaDevices.enumerateDevices();
    const sel = el('selDev'), cur = sel.value;
    sel.innerHTML='<option value="">(por defecto)</option>';
    devs.filter(d=>d.kind==='audioinput').forEach((d,i)=>{
      const o=document.createElement('option');
      o.value=d.deviceId; o.textContent=d.label||('entrada '+(i+1));
      sel.appendChild(o);
    });
    sel.value=cur;
  }catch(e){/* sin permiso todavía: no pasa nada */}
}

function setRunning(v){
  running=v;
  el('btnFreeze').disabled=!v; el('btnPng').disabled=!v;
  if(v && !raf) raf=requestAnimationFrame(loop);
}

/* ───────── mensajes de error ───────── */
function showError(err){
  const m=el('msg'); m.hidden=false;
  const insecure = !window.isSecureContext || !navigator.mediaDevices;
  if(insecure || err.name==='NotSupportedError'){
    m.innerHTML='<b>El navegador no entrega el micrófono desde este origen.</b> '+
      'Chrome solo lo permite en <code>https://</code> o <code>http://localhost</code> (no en <code>file://</code>). '+
      'Solución: servir la carpeta y abrirla por localhost — desde <code>material/</code> corre '+
      '<code>python3 -m http.server 8000 --directory _render</code> y abre la demo en <code>http://localhost:8000/…</code>.';
  }else if(err.name==='NotAllowedError'){
    m.innerHTML='<b>Permiso de micrófono denegado.</b> Habilítalo en el candado de la barra de direcciones y vuelve a apretar «Activar micrófono». '+
      'Si la demo está incrustada en las diapositivas, el permiso se pide para la página completa.';
  }else if(err.name==='NotFoundError'){
    m.innerHTML='<b>No hay ningún micrófono disponible.</b> Conecta la interfaz/micrófono y vuelve a intentar.';
  }else{
    m.textContent='Error al abrir el micrófono: '+err.name+' — '+err.message;
  }
}
function hideMsg(){ el('msg').hidden=true; }

/* ───────── medición: f₀ por pico interpolado, con guardia de octava ───────── */
function detectF0(){
  const df=binHz(), n=freqBuf.length;
  const loBin=Math.max(2, Math.floor(60/df));            // ignorar DC y zumbido de red
  const hiBin=Math.min(n-2, Math.ceil(Math.min(5000,nyquist())/df));
  let best=loBin, bestV=-Infinity, suma=0, n2=0;
  for(let i=loBin;i<hiBin;i++){ const v=freqBuf[i]; suma+=v; n2++; if(v>bestV){bestV=v; best=i;} }
  level = bestV;

  // silencio o puro ruido: el pico debe destacar sobre el fondo, si no, no se inventa nota
  const fondo = n2 ? suma/n2 : -200;
  if(bestV < -78 || bestV-fondo < 12){ f0=0; return; }

  // guardia de octava: si hay un pico casi tan fuerte en f/2, ese es el fundamental
  const half=Math.round(best/2);
  if(half>=loBin){
    let hb=half, hv=-Infinity;
    for(let i=Math.max(loBin,half-2);i<=half+2 && i<n;i++) if(freqBuf[i]>hv){hv=freqBuf[i]; hb=i;}
    if(hv > bestV-9) best=hb;
  }
  // interpolación parabólica sobre los dB vecinos
  const a=freqBuf[best-1], b=freqBuf[best], c=freqBuf[best+1];
  const den=(a-2*b+c);
  const d = den!==0 ? 0.5*(a-c)/den : 0;
  f0 = (best + Math.max(-1,Math.min(1,d))) * df;
}

const NOTAS=['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
function nota(f){
  if(!f) return null;
  const midi = 69 + 12*Math.log2(f/440);
  const r = Math.round(midi);
  return { nombre: NOTAS[((r%12)+12)%12] + (Math.floor(r/12)-1), cents: Math.round((midi-r)*100) };
}

/* ───────── dibujo ───────── */
function fit(c){
  const r=c.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  const w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr));
  if(c.width!==w||c.height!==h){ c.width=w; c.height=h; }
  const ctx=c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w:r.width, h:r.height};
}
function hz(f){ return f>=1000 ? (f/1000).toFixed(f%1000?1:0)+'k' : String(Math.round(f)); }

function drawWave(){
  const {ctx,w,h}=fit(cWave);
  ctx.clearRect(0,0,w,h);

  // ejes (se dibujan siempre, aunque todavía no haya señal)
  ctx.strokeStyle='#243044'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
  ctx.setLineDash([2,4]); ctx.strokeStyle='#1c2739';
  for(let k=1;k<4;k++){ const x=w*k/4; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.fillStyle='#8ea0bb'; ctx.font='12px system-ui'; ctx.textAlign='right';
  ctx.fillText(cfg.winMs+' ms', w-8, h-7);

  if(!timeBuf) return;

  const sr=audioCtx.sampleRate, N=timeBuf.length;
  const span=Math.max(16, Math.min(N, Math.round(sr*cfg.winMs/1000)));

  // escala automática suave (una flauta lejos del micrófono no puede verse plana)
  let pk=0; for(let i=0;i<N;i++){ const v=Math.abs(timeBuf[i]); if(v>pk) pk=v; }
  const target=Math.max(0.02, pk*1.25);
  waveScale += (target-waveScale)*(target>waveScale?0.35:0.03);

  // disparo: primer cruce por cero ascendente con amplitud suficiente
  let start=0; const thr=pk*0.15;
  for(let i=1;i<N-span;i++){ if(timeBuf[i-1]<=0 && timeBuf[i]>0 && timeBuf[i+1]>thr){ start=i; break; } }

  ctx.strokeStyle='#4cc2ff'; ctx.lineWidth=2; ctx.lineJoin='round';
  ctx.beginPath();
  for(let i=0;i<span;i++){
    const v=timeBuf[start+i]/waveScale;
    const x=i/(span-1)*w, y=h/2 - Math.max(-1,Math.min(1,v))*(h/2-6);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();

}

function drawSpec(){
  const {ctx,w,h}=fit(cSpec);
  ctx.clearRect(0,0,w,h);

  const df=binHz(), fm=fmaxHz(), top=TOP_DB, flo=cfg.floor;
  const yOf = db => h - ( (Math.max(flo,Math.min(top,db))-flo)/(top-flo) )*(h-16) - 4;

  // grilla
  ctx.font='12px system-ui'; ctx.textAlign='center';
  const step = fm<=2000?250 : fm<=5000?500 : fm<=10000?1000 : 2000;
  ctx.strokeStyle='#1c2739'; ctx.fillStyle='#6f8099'; ctx.lineWidth=1;
  for(let f=step; f<fm; f+=step){
    const x=f/fm*w;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h-14); ctx.stroke();
    ctx.fillText(hz(f), x, h-3);
  }
  ctx.textAlign='left';
  for(let db=top-10; db>flo; db-=20){
    const y=yOf(db);
    ctx.strokeStyle='#18222f'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    // no rotular si la línea queda bajo el título del panel (paneles bajos)
    if(y>32){ ctx.fillStyle='#4d5c72'; ctx.fillText(db+' dB', 4, y-3); }
  }

  ctx.fillStyle='#8ea0bb'; ctx.textAlign='right'; ctx.fillText('Hz', w-6, h-3);
  if(!freqBuf) return;
  const nMax = Math.min(freqBuf.length-1, Math.ceil(fm/df));

  // marcadores de armónicos de f₀
  if(cfg.harm && f0>0){
    ctx.setLineDash([3,4]); ctx.lineWidth=1;
    for(let k=1;k<=12;k++){
      const f=k*f0; if(f>=fm) break;
      const x=f/fm*w;
      ctx.strokeStyle = k===1 ? 'rgba(255,209,102,.85)' : 'rgba(255,209,102,.28)';
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h-14); ctx.stroke();
      if(k<=8){ ctx.fillStyle='rgba(255,209,102,.8)'; ctx.textAlign='center'; ctx.fillText(k===1?'f₀':k+'f₀', x, 32); }
    }
    ctx.setLineDash([]);
  }

  // retención de picos
  if(cfg.peak){
    for(let i=0;i<=nMax;i++){
      peakBuf[i] = freqBuf[i]>peakBuf[i] ? freqBuf[i] : peakBuf[i]-0.35;
    }
    ctx.strokeStyle='rgba(232,238,247,.35)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(let i=0;i<=nMax;i++){ const x=i*df/fm*w, y=yOf(peakBuf[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
  }

  // espectro
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(76,194,255,.55)'); grad.addColorStop(1,'rgba(76,194,255,.04)');
  ctx.beginPath(); ctx.moveTo(0,h);
  for(let i=0;i<=nMax;i++){ ctx.lineTo(i*df/fm*w, yOf(freqBuf[i])); }
  ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();

  ctx.beginPath();
  for(let i=0;i<=nMax;i++){ const x=i*df/fm*w, y=yOf(freqBuf[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.strokeStyle='#4cc2ff'; ctx.lineWidth=1.8; ctx.stroke();
}

function pushSono(){
  if(!freqBuf) return;
  const df=binHz(), fm=fmaxHz(), flo=cfg.floor, rng=TOP_DB-flo, d=colImg.data;
  for(let y=0;y<SONO_H;y++){
    const f=(1-(y+0.5)/SONO_H)*fm;
    const i=Math.min(freqBuf.length-1, Math.round(f/df));
    const [r,g,b]=cmap((freqBuf[i]-flo)/rng);
    const o=y*4; d[o]=r; d[o+1]=g; d[o+2]=b; d[o+3]=255;
  }
  sctx.putImageData(colImg, sonoCol, 0);
  sonoCol=(sonoCol+1)%SONO_W;
}

function drawSono(){
  const {ctx,w,h}=fit(cSono);
  ctx.imageSmoothingEnabled=true;
  // el anillo se dibuja en dos trozos: lo antiguo primero, lo reciente al final (derecha = ahora)
  const wOld=SONO_W-sonoCol;
  ctx.drawImage(sono, sonoCol,0, wOld,SONO_H,        0,0, w*wOld/SONO_W, h);
  ctx.drawImage(sono, 0,0, sonoCol,SONO_H,  w*wOld/SONO_W,0, w*sonoCol/SONO_W, h);

  // eje de frecuencia
  const fm=fmaxHz(), step = fm<=2000?500 : fm<=5000?1000 : fm<=10000?2000 : 5000;
  ctx.font='12px system-ui'; ctx.textAlign='right'; ctx.lineWidth=1;
  for(let f=step; f<fm; f+=step){
    const y=h-(f/fm)*h;
    ctx.strokeStyle='rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fillText(hz(f)+' Hz', w-6, y-3);
  }
}

function updateReadout(){
  const n=nota(f0);
  el('roF').textContent = f0 ? f0.toFixed(1) : '—';
  el('roN').textContent = n ? n.nombre : '—';
  el('roCents').textContent = n ? (n.cents>=0?'+':'')+n.cents+' cents' : '';
  el('roL').textContent = isFinite(level) && f0 ? level.toFixed(0) : '—';
}

/* ───────── bucle ───────── */
function loop(){
  raf=requestAnimationFrame(loop);
  if(!running || frozen || !analyser) return;
  analyser.getFloatTimeDomainData(timeBuf);
  analyser.getFloatFrequencyData(freqBuf);
  detectF0();
  drawWave(); drawSpec(); pushSono(); drawSono(); updateReadout();
}
function redrawFrozen(){          // al redimensionar o congelar: re-render sin datos nuevos
  drawWave(); drawSpec(); drawSono();
}

/* ───────── controles ───────── */
el('btnMic').onclick = startMic;
el('btnCfg').onclick = () => { const c=el('cfg'); c.hidden=!c.hidden; el('btnCfg').classList.toggle('on',!c.hidden); };
el('btnFreeze').onclick = toggleFreeze;
el('btnPng').onclick = savePng;

function toggleFreeze(){
  if(!running) return;
  frozen=!frozen;
  el('btnFreeze').textContent = frozen ? '▶ Reanudar' : '❄ Congelar';
  el('btnFreeze').classList.toggle('on', frozen);
  el('badge').hidden = !frozen;
}

el('selFmax').onchange = e => { cfg.fmax=+e.target.value; clearSono(); peakBuf&&peakBuf.fill(-200); redrawFrozen(); };
el('selFft').onchange  = e => { cfg.fft=+e.target.value; if(analyser) applyFft(); redrawFrozen(); };
el('selWin').onchange  = e => { cfg.winMs=+e.target.value; redrawFrozen(); };
el('selFloor').onchange= e => { cfg.floor=+e.target.value; clearSono(); redrawFrozen(); };
el('chkHarm').onchange = e => { cfg.harm=e.target.checked; redrawFrozen(); };
el('chkPeak').onchange = e => { cfg.peak=e.target.checked; peakBuf&&peakBuf.fill(-200); redrawFrozen(); };
el('selDev').onchange  = () => { if(micStream) startMic(); };
el('selTone').onchange = e => { const v=e.target.value; if(v) startTone(v); else { stopTone(); } };

function savePng(){
  const pad=10, W=1400;
  const parts=[cWave,cSpec,cSono];
  const hs=parts.map(c=>Math.round(W*c.height/c.width));
  const out=document.createElement('canvas');
  out.width=W; out.height=hs.reduce((a,b)=>a+b,0)+pad*(parts.length+1)+34;
  const o=out.getContext('2d');
  o.fillStyle='#0d1117'; o.fillRect(0,0,out.width,out.height);
  o.fillStyle='#e8eef7'; o.font='bold 20px system-ui';
  const n=nota(f0);
  o.fillText('IEE2103 — analizador en vivo' + (f0?`   ·   f₀ = ${f0.toFixed(1)} Hz   ·   ${n.nombre}`:''), pad, 24);
  let y=34+pad;
  parts.forEach((c,i)=>{ o.drawImage(c,pad,y,W-2*pad,hs[i]); y+=hs[i]+pad; });
  const a=document.createElement('a');
  a.download='analizador_'+(f0?Math.round(f0)+'Hz':'captura')+'.png';
  a.href=out.toDataURL('image/png'); a.click();
}

window.addEventListener('keydown', e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT') return;
  if(e.code==='Space'||e.key==='f'||e.key==='F'){ e.preventDefault(); toggleFreeze(); }
  else if(e.key==='g'||e.key==='G'){ if(running) savePng(); }
});

new ResizeObserver(()=>{ if(frozen||!running) redrawFrozen(); }).observe(document.body);

// aviso temprano si el origen no permite micrófono (típico al abrir con doble clic: file://)
if(!window.isSecureContext || !navigator.mediaDevices){
  showError(new DOMException('origen no seguro','NotSupportedError'));
}
listDevices();
redrawFrozen();
</script>
