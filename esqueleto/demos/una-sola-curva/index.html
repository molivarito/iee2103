<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una sola curva: X(ω) en 3D — IEE2103</title>
<style>
  :root{ --ink:#16202e; --dim:#65758b; --line:#d9e0ea; --bg:#ffffff;
         --pul:#2d70b3; --env:#c74440; --acc:#6042a6; --ghost:#9aa7b8; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;max-width:100%;overflow-x:hidden}
  body{background:var(--bg);color:var(--ink);
       font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  #app{height:100%;min-width:0;display:flex;flex-direction:column;padding:10px 14px;gap:8px;overflow:hidden}

  header{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
  .brand{font-weight:700;font-size:16px;white-space:nowrap;flex:0 0 auto}
  .brand span{font-weight:400;color:var(--dim);font-size:13px;margin-left:8px}
  .ctrls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}
  button{font:inherit;color:var(--ink);background:#f2f5f9;border:1px solid var(--line);
         border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
  button:hover{background:#e7edf5}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.primary:hover{background:#7355c0}
  button sup{font-size:0.75em}
  label.sl{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px}
  input[type=range]{width:120px;max-width:32vw}

  .lect{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;padding:0 2px}
  .cel{display:flex;align-items:baseline;gap:7px}
  .cel .k{color:var(--dim);font-size:12px;letter-spacing:.02em}
  .cel .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .cel.viva .v{color:var(--env)}
  .cel.fija .v{color:var(--acc)}
  .hint{color:var(--dim);font-size:13px;text-align:center;min-height:19px}
  .hint b{color:var(--acc)}

  .wrap{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:row;gap:8px}
  figure{margin:0;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;min-width:0;min-height:0}
  #fig3d{flex:3 1 0;min-width:0}
  .rightcol{flex:2 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
  #figT{flex:1 1 0;min-width:0;min-height:0}
  .formula{flex:0 0 auto;text-align:center;font-size:14px;color:var(--ink);min-height:20px;padding:2px 4px}
  .formula sup{font-size:0.72em}
  figcaption{position:absolute;top:6px;left:10px;z-index:2;color:var(--dim);font-size:12px;
             background:rgba(255,255,255,.9);padding:2px 7px;border-radius:5px;pointer-events:none;max-width:90%}
  canvas{display:block;width:100%;height:100%;min-width:0;min-height:0}
  #c3d{cursor:grab;touch-action:none}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">Una sola curva: X(ω) en 3D <span>IEE2103 · C12</span></div>
    <div class="ctrls">
      <button id="btnModeA">e<sup>−at</sup>u(t)</button>
      <button id="btnModeB">e<sup>−a|t|</sup>sgn(t)</button>
      <label class="sl">a <input type="range" id="slA"></label>
      <label class="sl">ω₀ <input type="range" id="slW0"></label>
      <button id="btnVista">vista inicial</button>
      <button id="btnReset">↺</button>
    </div>
  </header>

  <div class="lect">
    <div class="cel"><span class="k">a</span><span class="v" id="rA">—</span></div>
    <div class="cel viva"><span class="k">X(ω₀)</span><span class="v" id="rX">—</span></div>
    <div class="cel fija"><span class="k">|X(ω₀)|</span><span class="v" id="rMag">—</span></div>
    <div class="cel fija"><span class="k">∠X(ω₀)</span><span class="v" id="rAng">—</span></div>
  </div>

  <div class="wrap">
    <figure id="fig3d"><figcaption>X(ω) en 3D — sombra roja = Re X (piso), sombra azul = Im X (pared); arrastra para rotar</figcaption><canvas id="c3d"></canvas></figure>
    <div class="rightcol">
      <div class="formula" id="formula">—</div>
      <figure id="figT"><canvas id="cT"></canvas></figure>
    </div>
  </div>

  <div class="hint" id="hint">—</div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const c3d = $('c3d'), cT = $('cT');
const btnModeA=$('btnModeA'), btnModeB=$('btnModeB'), btnVista=$('btnVista'), btnReset=$('btnReset');
const slA=$('slA'), slW0=$('slW0');
const formulaEl=$('formula');

// ── el montaje ───────────────────────────────────────────────────────
// Modo A: x(t) = e^{-at}u(t)              X(ω) = 1/(a+jω)
//   Re X =  a/(a²+ω²)   Im X = -ω/(a²+ω²)   par/impar respectivamente.
// Modo B: x(t) = e^{-a|t|}·sgn(t)  (impar)  X(ω) = -2jω/(a²+ω²)
//   Re X = 0             Im X = -2ω/(a²+ω²)
// Comprobación: modo A, a=1, ω=1 → X=0.5-0.5j, |X|=0.707, ∠X=-45°.
//               modo B, a=1, ω=1 → X=-1j.
function Xval(omega, mode, a){
  const den = a*a + omega*omega;
  if(mode==='A') return { re: a/den, im: -omega/den };
  return { re: 0, im: -2*omega/den };
}

let mode='A', a=1, w0=1.5;
let animando=false; // (sin animación en esta demo; se deja la bandera por simetría de estilo)
const OMEGA_MAX = 8;                 // eje ω ∈ [-8,8]
const axHalf = OMEGA_MAX + 0.9;      // margen para el rótulo "ω"
const RI_RANGE = 1.2;                // rango visual FIJO de Re X e Im X (se recorta, no se reescala)
const scaleRI = OMEGA_MAX/2.2;         // amplitud 1 ocupa ~1/3 del semieje ω (escala no uniforme)
const gizLen = RI_RANGE*scaleRI;     // largo, en unidades 3D, de los ejes Re/Im y de piso/pared
const WALL_RE = RI_RANGE;            // la pared vive en Re = +1.2 (queda al fondo con la vista inicial)
const INIT_YAW = 0.42, INIT_PITCH = 0.36;
let yaw=INIT_YAW, pitch=INIT_PITCH;
let dragging=false, lastX=0, lastY=0;

// parámetros de prueba: ?modo=B&a=0.1&w0=1
{
  const p = new URLSearchParams(location.search);
  if(p.has('modo')){ const v=p.get('modo').toUpperCase(); if(v==='A'||v==='B') mode=v; }
  if(p.has('a')){ const v=parseFloat(p.get('a')); if(isFinite(v) && v>=0.05 && v<=3) a=v; }
  if(p.has('w0')){ const v=parseFloat(p.get('w0')); if(isFinite(v) && v>=-8 && v<=8) w0=v; }
}

// ── canvas helpers (igual que la plantilla) ───────────────────────────
function fit(c){
  const r=c.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr));
  if(c.width!==w||c.height!==h){ c.width=w; c.height=h; }
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  return {ctx, w:r.width, h:r.height};
}
function mapa(w,h,xmin,xmax,ymin,ymax,pad){
  const L=pad.l,R=pad.r,T=pad.t,B=pad.b;
  return {
    X: x => L + (x-xmin)/(xmax-xmin)*(w-L-R),
    Y: y => h-B - (y-ymin)/(ymax-ymin)*(h-T-B)
  };
}
function arrow2(ctx,p1,p2){
  ctx.beginPath(); ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy); ctx.stroke();
  const ang=Math.atan2(p2.sy-p1.sy,p2.sx-p1.sx), s=6;
  ctx.beginPath();
  ctx.moveTo(p2.sx,p2.sy);
  ctx.lineTo(p2.sx-s*Math.cos(ang-0.4), p2.sy-s*Math.sin(ang-0.4));
  ctx.lineTo(p2.sx-s*Math.cos(ang+0.4), p2.sy-s*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
}
function fmtNum(x){ const s=Math.abs(x).toFixed(3); return (x<-5e-4?'−':'')+s; }
function fmtComplex(re,im){
  const sign = im<-5e-4 ? '−' : '+';
  return fmtNum(re)+' '+sign+' '+Math.abs(im).toFixed(3)+'j';
}
function fmtDeg(deg){ return (deg<-5e-4?'−':'')+Math.abs(deg).toFixed(1)+'°'; }
function clip(v,lim){ return v<-lim?-lim:(v>lim?lim:v); }

// ── proyección 3D: X=ω (eje largo), Y=Im X (arriba), Z=Re X (hacia el observador) ──
function rot(x,y,z){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const x1 = x*cy + z*sy, z1 = -x*sy + z*cy, y1 = y;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  const y2 = y1*cp - z1*sp, z2 = y1*sp + z1*cp;
  return {x:x1, y:y2, z:z2};
}
function proj(x,y,z,cx,cy0,u){
  const p=rot(x,y,z);
  return { sx: cx+p.x*u, sy: cy0-p.y*u, depth:p.z };
}

// ── panel 1: X(ω) en 3D ────────────────────────────────────────────
function draw3D(){
  const {ctx,w,h}=fit(c3d);

  // caja fija (no depende de a ni ω0: todo se recorta a este cubo) → el
  // auto-ajuste solo reacciona a la rotación, como en la plantilla.
  const boundPts = [
    rot(-axHalf,0,0), rot(axHalf,0,0), rot(0,gizLen,0), rot(0,0,gizLen)
  ];
  for(const s1 of [-1,1]) for(const s2 of [-1,1]) for(const s3 of [-1,1])
    boundPts.push(rot(s1*OMEGA_MAX, s2*gizLen, s3*gizLen));
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of boundPts){
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  const padSide=w*0.05, padTop=h*0.11, padBottom=h*0.13;
  const availW=Math.max(40,w-2*padSide), availH=Math.max(40,h-padTop-padBottom);
  const u = Math.min(availW/((maxX-minX)||1), availH/((maxY-minY)||1));
  const cx = padSide + availW/2 - u*(minX+maxX)/2;
  const cy0 = padTop + availH/2 - u*(minY+maxY)/2;
  const P = (x,y,z) => proj(x,y,z,cx,cy0,u);

  // ── piso (Im X = -1.2) y pared (Re X = +1.2): borde + grilla tenue ──
  ctx.lineWidth=1;
  const gridFracs=[-RI_RANGE,-RI_RANGE/2,0,RI_RANGE/2,RI_RANGE];
  // piso: rectángulo ω×Re en Im=-gizLen
  ctx.strokeStyle='rgba(180,190,205,0.55)';
  ctx.beginPath();
  let q=P(-OMEGA_MAX,-gizLen,-gizLen); ctx.moveTo(q.sx,q.sy);
  q=P(OMEGA_MAX,-gizLen,-gizLen); ctx.lineTo(q.sx,q.sy);
  q=P(OMEGA_MAX,-gizLen,gizLen); ctx.lineTo(q.sx,q.sy);
  q=P(-OMEGA_MAX,-gizLen,gizLen); ctx.lineTo(q.sx,q.sy);
  ctx.closePath(); ctx.stroke();
  ctx.strokeStyle='rgba(180,190,205,0.35)';
  for(const re of gridFracs){
    const a1=P(-OMEGA_MAX,-gizLen,re*scaleRI), b1=P(OMEGA_MAX,-gizLen,re*scaleRI);
    ctx.beginPath(); ctx.moveTo(a1.sx,a1.sy); ctx.lineTo(b1.sx,b1.sy); ctx.stroke();
  }
  // pared: rectángulo ω×Im en Re=+gizLen
  ctx.strokeStyle='rgba(180,190,205,0.55)';
  ctx.beginPath();
  q=P(-OMEGA_MAX,-gizLen,WALL_RE*scaleRI); ctx.moveTo(q.sx,q.sy);
  q=P(OMEGA_MAX,-gizLen,WALL_RE*scaleRI); ctx.lineTo(q.sx,q.sy);
  q=P(OMEGA_MAX,gizLen,WALL_RE*scaleRI); ctx.lineTo(q.sx,q.sy);
  q=P(-OMEGA_MAX,gizLen,WALL_RE*scaleRI); ctx.lineTo(q.sx,q.sy);
  ctx.closePath(); ctx.stroke();
  ctx.strokeStyle='rgba(180,190,205,0.35)';
  for(const im of gridFracs){
    const a1=P(-OMEGA_MAX,im*scaleRI,WALL_RE*scaleRI), b1=P(OMEGA_MAX,im*scaleRI,WALL_RE*scaleRI);
    ctx.beginPath(); ctx.moveTo(a1.sx,a1.sy); ctx.lineTo(b1.sx,b1.sy); ctx.stroke();
  }

  // eje ω (por el origen Re=Im=0)
  const axA=P(-axHalf,0,0), axB=P(axHalf,0,0);
  ctx.strokeStyle='#16202e'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(axA.sx,axA.sy); ctx.lineTo(axB.sx,axB.sy); ctx.stroke();
  // marcas y números en el eje ω
  ctx.font='11px system-ui'; ctx.textAlign='center'; ctx.textBaseline='top';
  for(const wv of [-8,-4,0,4,8]){
    const t0p=P(wv,0,0);
    ctx.strokeStyle='#9aa7b8'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(t0p.sx,t0p.sy); ctx.lineTo(t0p.sx,t0p.sy+10); ctx.stroke();
    ctx.fillStyle='#65758b';
    ctx.fillText(wv<0?('−'+Math.abs(wv)):String(wv), t0p.sx, t0p.sy+13);
  }
  const wLbl=P(axHalf+0.4,0,0);
  ctx.fillStyle='#16202e'; ctx.font='bold 13px system-ui';
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText('ω', wLbl.sx, wLbl.sy);

  // ejes Re X / Im X por el origen (ω=0)
  const O=P(0,0,0), ReP=P(0,0,gizLen), ImP=P(0,gizLen,0);
  ctx.strokeStyle='#6042a6'; ctx.fillStyle='#6042a6'; ctx.lineWidth=1.8;
  arrow2(ctx,O,ReP); arrow2(ctx,O,ImP);
  ctx.font='bold 12px system-ui';
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText('Re X', ReP.sx+6, ReP.sy);
  ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText('Im X', ImP.sx, ImP.sy-6);

  // ── muestreo de las curvas ──────────────────────────────────────
  const N=420;
  const mainPts=[], floorRePts=[], floorMagPts=[], wallImPts=[], guidePts=[];
  for(let i=0;i<=N;i++){
    const wv = -OMEGA_MAX + (2*OMEGA_MAX)*i/N;
    const {re,im} = Xval(wv,mode,a);
    // fuera del rango visible la curva se CORTA (null), no se aplana: con a
    // chico debe verse que X se sale de la caja, no una meseta falsa
    const R=RI_RANGE, inRe=Math.abs(re)<=R, inIm=Math.abs(im)<=R, mag=Math.hypot(re,im);
    mainPts.push(inRe&&inIm ? P(wv, im*scaleRI, re*scaleRI) : null);
    floorRePts.push(inRe ? P(wv, -gizLen, re*scaleRI) : null);
    floorMagPts.push(mag<=R ? P(wv, -gizLen, mag*scaleRI) : null);
    wallImPts.push(inIm ? P(wv, im*scaleRI, WALL_RE*scaleRI) : null);
    if(mode==='B'){
      const imG = Math.abs(wv)>1e-6 ? -2/wv : Infinity;   // guía a→0, no definida en ω=0
      guidePts.push(Math.abs(imG)<=R ? P(wv, imG*scaleRI, 0) : null);
    }
  }
  function strokePath(pts, style, lw, dashed){
    ctx.strokeStyle=style; ctx.lineWidth=lw; ctx.setLineDash(dashed?[5,4]:[]);
    ctx.beginPath(); let started=false;
    for(const p of pts){
      if(!p){ started=false; continue; }
      if(!started){ ctx.moveTo(p.sx,p.sy); started=true; } else ctx.lineTo(p.sx,p.sy);
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  // guía gris del límite a→0 (solo modo B), detrás de todo lo demás
  if(mode==='B') strokePath(guidePts, 'rgba(154,167,184,0.65)', 1.2, true);

  // sombras: |X| (piso, gris fino), Re X (piso, roja), Im X (pared, azul)
  strokePath(floorMagPts, 'rgba(154,167,184,0.85)', 1.3, false);
  strokePath(floorRePts, 'rgba(199,68,64,0.9)', 2.2, false);
  strokePath(wallImPts, 'rgba(45,112,179,0.9)', 2.2, false);

  // punto en ω0 + segmentos finos a sus dos sombras
  const {re:re0,im:im0} = Xval(w0,mode,a);
  const re0C=clip(re0,RI_RANGE), im0C=clip(im0,RI_RANGE);
  const fuera0 = Math.abs(re0)>RI_RANGE || Math.abs(im0)>RI_RANGE;
  const pMain=P(w0, im0C*scaleRI, re0C*scaleRI);
  const pFloor=P(w0, -gizLen, re0C*scaleRI);
  const pWall=P(w0, im0C*scaleRI, WALL_RE*scaleRI);
  if(!fuera0){
    ctx.strokeStyle='rgba(22,32,46,0.55)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(pMain.sx,pMain.sy); ctx.lineTo(pFloor.sx,pFloor.sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pMain.sx,pMain.sy); ctx.lineTo(pWall.sx,pWall.sy); ctx.stroke();
    ctx.fillStyle='#c74440'; ctx.beginPath(); ctx.arc(pFloor.sx,pFloor.sy,3.4,0,7); ctx.fill();
    ctx.fillStyle='#2d70b3'; ctx.beginPath(); ctx.arc(pWall.sx,pWall.sy,3.4,0,7); ctx.fill();
  }

  // curva principal X(ω), negra y gruesa, al frente de todo
  strokePath(mainPts, '#16202e', 3, false);
  if(!fuera0){ ctx.fillStyle='#16202e'; ctx.beginPath(); ctx.arc(pMain.sx,pMain.sy,4.2,0,7); ctx.fill(); }
}

// ── panel 2: x(t) ───────────────────────────────────────────────────
function xt(t, mode, a){
  if(mode==='A') return t<0 ? 0 : Math.exp(-a*t);
  return t<0 ? -Math.exp(a*t) : Math.exp(-a*t);
}
function drawTime(){
  const {ctx,w,h}=fit(cT);
  const tmin = mode==='A' ? -4 : -5, tmax = mode==='A' ? 6 : 5;
  const M=mapa(w,h,tmin,tmax,-1.35,1.35,{l:28,r:20,t:20,b:26});
  const y0=M.Y(0);

  ctx.strokeStyle='#c9d3e0'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(w,y0); ctx.stroke();

  ctx.font='11px system-ui';
  for(let k=Math.ceil(tmin);k<=Math.floor(tmax);k++){
    const x=M.X(k), major=(k%2===0);
    ctx.strokeStyle= major ? '#8a97a8' : '#c9d3e0';
    ctx.beginPath(); ctx.moveTo(x,y0-(major?5:3)); ctx.lineTo(x,y0+(major?5:3)); ctx.stroke();
    if(major){
      ctx.fillStyle='#8a97a8';
      ctx.textAlign = k===Math.ceil(tmin) ? 'left' : (k===Math.floor(tmax) ? 'right' : 'center');
      ctx.fillText(String(k), x, y0+16);
    }
  }
  ctx.textAlign='right'; ctx.fillStyle='#8a97a8'; ctx.fillText('t', w-4, y0-6);
  ctx.textAlign='left'; ctx.fillText('x(t)', 6, M.Y(1.28));

  ctx.strokeStyle='#c9d3e0'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,M.Y(1)); ctx.lineTo(8,M.Y(1)); ctx.moveTo(0,M.Y(-1)); ctx.lineTo(8,M.Y(-1)); ctx.stroke();
  ctx.textAlign='left'; ctx.fillStyle='#8a97a8'; ctx.font='11px system-ui';
  ctx.fillText('+1', 2, M.Y(1)-4);
  ctx.fillText('−1', 2, M.Y(-1)+13);

  ctx.strokeStyle='#b9c4d2'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(M.X(0),M.Y(1.3)); ctx.lineTo(M.X(0),M.Y(-1.3)); ctx.stroke();
  ctx.setLineDash([]);

  // curva, en dos tramos (t<0 / t>0) con el salto explícito en t=0
  const NS=240;
  const leftLimit = mode==='A' ? 0 : -1;   // xt(0⁻)
  const rightStart = xt(0,mode,a);         // xt(0⁺) = 1 en ambos modos
  ctx.strokeStyle='#2d70b3'; ctx.lineWidth=2.8; ctx.beginPath();
  for(let i=0;i<=NS;i++){
    const t = tmin + (0-tmin)*i/NS;
    const x=M.X(t), y=M.Y(xt(t,mode,a));
    i? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.lineTo(M.X(0), M.Y(leftLimit));
  ctx.lineTo(M.X(0), M.Y(rightStart));     // salto vertical en t=0
  for(let i=0;i<=NS;i++){
    const t = 0 + (tmax-0)*i/NS;
    ctx.lineTo(M.X(t), M.Y(xt(t,mode,a)));
  }
  ctx.stroke();
}

// ── fórmula, lecturas y pie ────────────────────────────────────────
function updateFormula(){
  formulaEl.innerHTML = mode==='A'
    ? 'x(t) = e<sup>−at</sup>u(t)  ↔  X(ω) = 1 / (a + jω)'
    : 'x(t) = e<sup>−a|t|</sup> sgn(t)  ↔  X(ω) = −2jω / (a<sup>2</sup> + ω<sup>2</sup>)';
}
function hintText(){
  return mode==='A'
    ? 'Re X es par (sombra roja), Im X es impar (azul): X(−ω) = X*(ω). Al subir a, la exponencial cae más rápido y el espectro se ensancha.'
    : 'Señal real e impar ⇒ X imaginaria pura (Re X = 0). Con a → 0 la curva se pega a 2/(jω): la transformada del signo.';
}
function lectura(){
  $('rA').textContent = a.toFixed(2);
  const {re,im} = Xval(w0,mode,a);
  $('rX').textContent = fmtComplex(re,im);
  $('rMag').textContent = Math.hypot(re,im).toFixed(3);
  $('rAng').textContent = fmtDeg(Math.atan2(im,re)*180/Math.PI);
  $('hint').textContent = hintText();
  updateFormula();
  btnModeA.classList.toggle('primary', mode==='A');
  btnModeB.classList.toggle('primary', mode==='B');
}
function pinta(){ draw3D(); drawTime(); lectura(); }

// ── controles ──────────────────────────────────────────────────────
function setMode(m){ mode=m; pinta(); }
function vistaInicial(){ yaw=INIT_YAW; pitch=INIT_PITCH; draw3D(); }
function resetAll(){ mode='A'; a=1; w0=1.5; yaw=INIT_YAW; pitch=INIT_PITCH; slA.value=a; slW0.value=w0; pinta(); }

slA.min=0.05; slA.max=3; slA.step=0.05; slA.value=a;
slW0.min=-8; slW0.max=8; slW0.step=0.1; slW0.value=w0;

btnModeA.onclick=()=>setMode('A');
btnModeB.onclick=()=>setMode('B');
btnVista.onclick=vistaInicial;
btnReset.onclick=resetAll;
slA.oninput=e=>{ a=+e.target.value; pinta(); };
slW0.oninput=e=>{ w0=+e.target.value; pinta(); };

// dentro de reveal.js: cualquier toque en la demo le da el foco al iframe,
// para que espacio/P/R lleguen aquí y no cambien de lámina
document.addEventListener('pointerdown', ()=>window.focus(), true);

// arrastre (ratón y táctil) para rotar el panel 3D
c3d.addEventListener('pointerdown', e=>{
  dragging=true; lastX=e.clientX; lastY=e.clientY;
  c3d.setPointerCapture(e.pointerId); c3d.style.cursor='grabbing';
});
c3d.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  yaw += dx*0.008;
  pitch = Math.max(-1.4, Math.min(1.4, pitch - dy*0.008));
  draw3D();
});
c3d.addEventListener('pointerup', ()=>{ dragging=false; c3d.style.cursor='grab'; });
c3d.addEventListener('pointercancel', ()=>{ dragging=false; c3d.style.cursor='grab'; });

// teclado propio del iframe: no debe interferir con reveal.js del padre
document.addEventListener('keydown', e=>{
  if(e.target && e.target.tagName==='INPUT') return;
  if(e.key==='m'||e.key==='M'){ e.stopPropagation(); setMode(mode==='A'?'B':'A'); }
  else if(e.key==='r'||e.key==='R'){ e.stopPropagation(); resetAll(); }
});

new ResizeObserver(()=>pinta()).observe(document.body);
pinta();   // primer cuadro sin depender de requestAnimationFrame
</script>
</body>
</html>
