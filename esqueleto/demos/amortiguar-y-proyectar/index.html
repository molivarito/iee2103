<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amortiguar y proyectar — IEE2103</title>
<style>
  :root{ --ink:#16202e; --dim:#65758b; --line:#d9e0ea; --bg:#ffffff;
         --dec:#2f7d3c; --cre:#c0560f; --costa:#2d70b3; --re:#c74440; --acc:#6042a6; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;max-width:100%;overflow-x:hidden}
  body{background:var(--bg);color:var(--ink);
       font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  #app{height:100%;min-width:0;display:flex;flex-direction:column;padding:10px 14px;gap:8px;overflow:hidden}

  header{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
  .brand{font-weight:700;font-size:16px;white-space:nowrap;flex:0 0 auto}
  .brand span{font-weight:400;color:var(--dim);font-size:13px;margin-left:8px}
  .ctrls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}
  button{font:inherit;color:var(--ink);background:#f2f5f9;border:1px solid var(--line);
         border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
  button:hover{background:#e7edf5}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;min-width:112px}
  button.primary:hover{background:#7355c0}
  label.sl{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px}
  input[type=range]{width:150px;max-width:28vw}

  .lect{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;padding:0 2px}
  .cel{display:flex;align-items:baseline;gap:7px}
  .cel .k{color:var(--dim);font-size:12px;letter-spacing:.02em}
  .cel .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .v.dec{color:var(--dec)} .v.cre{color:var(--cre)} .v.cos{color:var(--costa)}
  .hint{color:var(--dim);font-size:13px;text-align:center;min-height:19px}

  .wrap{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:row;gap:8px}
  .col{flex:9 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
  figure{margin:0;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;min-width:0;min-height:0}
  #figS{flex:4 1 0}
  #figT{flex:1 1 0}
  #figW{flex:1 1 0}
  figcaption{position:absolute;top:5px;left:9px;z-index:2;color:var(--dim);font-size:12px;line-height:1.35;
             background:rgba(255,255,255,.9);padding:2px 7px;border-radius:5px;pointer-events:none;max-width:95%}
  figcaption sup, figcaption sub{font-size:0.75em}
  figcaption b{color:var(--ink)}
  canvas{display:block;width:100%;height:100%;min-width:0;min-height:0}
  #cS{cursor:ew-resize;touch-action:none}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">Amortiguar y proyectar <span>IEE2103 · plano s</span></div>
    <div class="ctrls">
      <button id="btnPlay" class="primary">▶ barrer σ₀</button>
      <label class="sl">σ₀ <input type="range" id="slS"></label>
      <button id="btnModo">señal: se apaga</button>
      <button id="btnReset">↺</button>
    </div>
  </header>

  <div class="lect">
    <div class="cel"><span class="k">recta Re(s) = σ₀ =</span><span class="v" id="rS">—</span></div>
    <div class="cel"><span class="k">la señal amortiguada decae como e^(−αt), α = a + σ₀ =</span><span class="v" id="rA">—</span></div>
    <div class="cel"><span class="k">alto del cerro ≈ 1/(2α) =</span><span class="v" id="rH">—</span></div>
    <div class="cel"><span class="k">ancho ≈ α =</span><span class="v" id="rW">—</span></div>
  </div>

  <div class="wrap">
    <figure id="figS">
      <figcaption><b>plano s</b> — arrastra la recta σ₀</figcaption>
      <canvas id="cS"></canvas>
    </figure>
    <div class="col">
      <figure id="figT">
        <figcaption><b>1 · amortiguar</b> — gris: x(t) ·
          <span style="color:#c74440">rojo: x(t)·e<sup>−σ₀t</sup>, la señal que recibe Fourier</span></figcaption>
        <canvas id="cT"></canvas>
      </figure>
      <figure id="figW">
        <figcaption><b>2 · proyectar</b> —
          <span style="color:#c74440">|X(σ₀ + jω)|: el espectro de Fourier de la señal roja</span> ·
          <span style="color:#2d70b3">azul: σ₀ = 0, Fourier sin amortiguar</span></figcaption>
        <canvas id="cW"></canvas>
      </figure>
    </div>
  </div>

  <div class="hint" id="hint">—</div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const cS=$('cS'), cT=$('cT'), cW=$('cW');
const btnPlay=$('btnPlay'), slS=$('slS'), btnModo=$('btnModo');

// ── el montaje ───────────────────────────────────────────────────────
// x(t) = e^{−at} sin(ω₀t) u(t)  →  X(s) = ω₀ / ((s+a)² + ω₀²),  polos en −a ± jω₀, ROC: Re(s) > −a.
// Sobre la recta Re(s) = σ₀:  X(σ₀+jω) = F{ x(t) e^{−σ₀t} }(ω)  — Fourier de la señal amortiguada.
// Con α = a + σ₀:  |X| = ω₀ / |α² − ω² + ω₀² + j2αω|.  Cerca de ω₀ y con α chico: |X| ≈ 1/(2·√(α²+(ω−ω₀)²)).
// Comprobación: a = 0.5, σ₀ = 0, ω = ω₀ = 4 → |X| = 4/|0.25 + j4| = 0.998 ≈ 1/(2·0.5).
const W0 = 4;
const A_DEC = 0.5, A_CRE = -0.4;       // «se apaga» (polos a la izquierda) / «crece» (polos a la derecha)
const SIG_MIN=-1.5, SIG_MAX=2.5, OM_MAX=7;
const S0_MIN=-1.2, S0_MAX=2.3, S0_INI=1.2;
const TMAX=10, YT=1.25;                // ventana del tiempo
const WMAX=8, YW=3.2;                  // ventana del espectro: lo que sube más se CORTA y se rotula
const EPS=0.02;                        // |α| < EPS: «sobre el polo»
let a=A_DEC, s0=S0_INI, playing=false, dir=-1, hold=0, dragS=false;

{ // parámetros de prueba: ?s0=0.2&modo=crece
  const p=new URLSearchParams(location.search);
  if(p.get('modo')==='crece') a=A_CRE;
  if(p.has('s0')){ const v=parseFloat(p.get('s0')); if(isFinite(v)) s0=Math.min(S0_MAX,Math.max(S0_MIN,v)); }
}

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const INK=css('--ink'), DIM=css('--dim'), LINE=css('--line'), DEC=css('--dec'), CRE=css('--cre'),
      COSTA=css('--costa'), RE=css('--re'), ACC=css('--acc');

function fit(c){
  const r=c.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr));
  if(c.width!==w||c.height!==h){ c.width=w; c.height=h; }
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  return {ctx, w:r.width, h:r.height};
}
function fmt(x,d){ const s=Math.abs(x).toFixed(d); return (x<0 && +s!==0 ? '−' : '')+s; }
const magX = (alpha,w) => W0/Math.hypot(alpha*alpha-w*w+W0*W0, 2*alpha*w);

// ── plano s ──────────────────────────────────────────────────────────
let mapS=null;
function drawS(){
  const {ctx,w,h}=fit(cS);
  const L=30,R=10,T=30,B=24;
  const X=s=>L+(s-SIG_MIN)/(SIG_MAX-SIG_MIN)*(w-L-R), Y=o=>T+(OM_MAX-o)/(2*OM_MAX)*(h-T-B);
  mapS={inv:px=>SIG_MIN+(px-L)/(w-L-R)*(SIG_MAX-SIG_MIN)};
  // ROC: a la derecha de los polos
  ctx.fillStyle='rgba(47,125,60,.13)'; ctx.fillRect(X(-a),T,X(SIG_MAX)-X(-a),h-T-B);
  ctx.fillStyle=DEC; ctx.font='600 12px system-ui'; ctx.textAlign='right';
  ctx.fillText('ROC', X(SIG_MAX)-4, h-B-6);
  // borde de la ROC
  ctx.strokeStyle='rgba(47,125,60,.7)'; ctx.setLineDash([4,4]); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(X(-a),T); ctx.lineTo(X(-a),h-B); ctx.stroke(); ctx.setLineDash([]);
  // eje σ
  ctx.strokeStyle=LINE; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(L,Y(0)); ctx.lineTo(w-R,Y(0)); ctx.stroke();
  ctx.fillStyle=DIM; ctx.font='11px system-ui'; ctx.textAlign='center';
  for(const s of [-1,1,2]){ ctx.fillText(fmt(s,0), X(s), Y(0)+13);
    ctx.beginPath(); ctx.moveTo(X(s),Y(0)-3); ctx.lineTo(X(s),Y(0)+3); ctx.stroke(); }
  ctx.fillText('σ', w-R-5, Y(0)-6);
  ctx.textAlign='right';
  for(const o of [-4,4]) ctx.fillText('j'+fmt(o,0), L-4, Y(o)+4);
  // la costa: el eje jω
  ctx.strokeStyle=COSTA; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(X(0),T); ctx.lineTo(X(0),h-B); ctx.stroke();
  ctx.save(); ctx.translate(X(0)-6, h-B-4); ctx.rotate(-Math.PI/2);
  ctx.fillStyle=COSTA; ctx.font='600 11px system-ui'; ctx.textAlign='left';
  ctx.fillText('eje jω: Fourier', 0, 0); ctx.restore();
  // polos
  ctx.strokeStyle=ACC; ctx.lineWidth=2.6;
  for(const o of [W0,-W0]){ const x=X(-a), y=Y(o), r=6;
    ctx.beginPath(); ctx.moveTo(x-r,y-r); ctx.lineTo(x+r,y+r); ctx.moveTo(x-r,y+r); ctx.lineTo(x+r,y-r); ctx.stroke(); }
  ctx.fillStyle=ACC; ctx.font='600 11px system-ui'; ctx.textAlign='right';
  ctx.fillText('polo', X(-a)-10, Y(W0)+4); ctx.fillText('polo', X(-a)-10, Y(-W0)+4);
  // la recta σ₀
  const alpha=a+s0, col = alpha>EPS ? RE : CRE;
  ctx.strokeStyle=col; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.moveTo(X(s0),T); ctx.lineTo(X(s0),h-B); ctx.stroke();
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X(s0),Y(0),6,0,7); ctx.fill();
  ctx.font='700 12px system-ui'; ctx.textAlign = s0>1.7 ? 'right' : 'left';
  ctx.fillText('σ₀', X(s0)+(s0>1.7?-9:9), T+12);
}

// ── tiempo ───────────────────────────────────────────────────────────
function plotBox(ctx,w,h){ return {L:34,R:12,T:26,B:20,w,h}; }
function drawT(){
  const {ctx,w,h}=fit(cT), b=plotBox(ctx,w,h);
  const X=t=>b.L+t/TMAX*(w-b.L-b.R), Y=y=>b.T+(YT-y)/(2*YT)*(h-b.T-b.B);
  ctx.save(); ctx.beginPath(); ctx.rect(b.L,b.T,w-b.L-b.R,h-b.T-b.B); ctx.clip();
  ctx.strokeStyle=LINE; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(b.L,Y(0)); ctx.lineTo(w-b.R,Y(0)); ctx.stroke();
  const alpha=a+s0, N=700;
  const curve=(f,style,lw,dash)=>{ ctx.strokeStyle=style; ctx.lineWidth=lw; ctx.setLineDash(dash||[]);
    ctx.beginPath(); for(let i=0;i<=N;i++){ const t=TMAX*i/N, y=Math.max(-50,Math.min(50,f(t)));
      i?ctx.lineTo(X(t),Y(y)):ctx.moveTo(X(t),Y(y)); } ctx.stroke(); ctx.setLineDash([]); };
  curve(t=>Math.exp(-a*t)*Math.sin(W0*t), '#aab4c2', 1.3);
  const col = alpha>EPS ? RE : CRE;
  curve(t=> Math.exp(-alpha*t), col, 1.1, [4,4]);
  curve(t=>-Math.exp(-alpha*t), col, 1.1, [4,4]);
  curve(t=>Math.exp(-alpha*t)*Math.sin(W0*t), col, 2.2);
  ctx.restore();
  ctx.fillStyle=DIM; ctx.font='11px system-ui'; ctx.textAlign='center';
  for(const t of [0,2,4,6,8,10]) ctx.fillText(t, X(t), h-6);
  ctx.textAlign='right'; ctx.fillText('t', w-4, Y(0)-5);
  ctx.fillText('1', b.L-5, Y(1)+4); ctx.fillText('−1', b.L-5, Y(-1)+4);
  ctx.textAlign='right'; ctx.font='600 12px system-ui'; ctx.fillStyle=col;
  const msg = alpha>EPS ? 'se apaga: Fourier puede con ella'
            : alpha<-EPS ? 'crece: Fourier no puede' : 'ni crece ni decae: oscilación eterna';
  const mw=ctx.measureText(msg).width;
  ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillRect(w-b.R-mw-10, b.T, mw+10, 17);
  ctx.fillStyle=col; ctx.fillText(msg, w-b.R-4, b.T+12);
}

// ── espectro ─────────────────────────────────────────────────────────
function drawW(){
  const {ctx,w,h}=fit(cW), b=plotBox(ctx,w,h);
  const X=o=>b.L+(o+WMAX)/(2*WMAX)*(w-b.L-b.R), Y=y=>b.T+(YW-y)/YW*(h-b.T-b.B);
  const alpha=a+s0, N=900, y0=Y(0);
  ctx.strokeStyle=LINE; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(b.L,y0); ctx.lineTo(w-b.R,y0); ctx.stroke();
  ctx.fillStyle=DIM; ctx.font='11px system-ui'; ctx.textAlign='center';
  for(const o of [-8,-4,0,4,8]) ctx.fillText(o===4?'ω₀':o===-4?'−ω₀':fmt(o,0), X(o), h-6);
  ctx.textAlign='right'; ctx.fillText('ω', w-4, y0-5);
  for(const y of [1,2,3]){ ctx.fillText(y, b.L-5, Y(y)+4);
    ctx.strokeStyle='#eef2f7'; ctx.beginPath(); ctx.moveTo(b.L,Y(y)); ctx.lineTo(w-b.R,Y(y)); ctx.stroke(); }
  ctx.save(); ctx.beginPath(); ctx.rect(b.L,b.T,w-b.L-b.R,h-b.T-b.B); ctx.clip();
  const curve=(al,style,lw,fill)=>{ ctx.beginPath();
    for(let i=0;i<=N;i++){ const o=-WMAX+2*WMAX*i/N, y=Math.min(40,magX(al,o));
      i?ctx.lineTo(X(o),Y(y)):ctx.moveTo(X(o),Y(y)); }
    if(fill){ ctx.lineTo(X(WMAX),y0); ctx.lineTo(X(-WMAX),y0); ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
      ctx.beginPath(); for(let i=0;i<=N;i++){ const o=-WMAX+2*WMAX*i/N, y=Math.min(40,magX(al,o));
        i?ctx.lineTo(X(o),Y(y)):ctx.moveTo(X(o),Y(y)); } }
    ctx.strokeStyle=style; ctx.lineWidth=lw; ctx.stroke(); };
  if(a>EPS) curve(a, 'rgba(45,112,179,.75)', 1.4);          // σ₀ = 0: Fourier sin amortiguar (si existe)
  if(alpha>EPS) curve(alpha, RE, 2.2, 'rgba(199,68,64,.12)');
  ctx.restore();
  ctx.textAlign='center';
  if(alpha>EPS){
    const pico=magX(alpha, Math.sqrt(Math.max(0,W0*W0-alpha*alpha)));
    if(pico>YW){                       // el cerro se sale del marco: flecha y valor
      ctx.fillStyle=RE; ctx.font='700 12px system-ui';
      for(const o of [W0,-W0]){ const x=X(o);
        ctx.beginPath(); ctx.moveTo(x,b.T+2); ctx.lineTo(x-5,b.T+11); ctx.lineTo(x+5,b.T+11); ctx.closePath(); ctx.fill(); }
      ctx.textAlign='left'; ctx.fillText('sigue hasta '+fmt(pico,1), X(W0)+10, b.T+24);
    }
  } else {
    ctx.fillStyle=CRE; ctx.font='700 15px system-ui';
    const txt = alpha<-EPS ? 'la integral no converge: σ₀ quedó fuera de la ROC'
                           : 'justo sobre los polos: el cerro se volvió un delta en ±ω₀';
    ctx.fillText(txt, (b.L+w-b.R)/2, (b.T+h-b.B)/2+18);
    if(Math.abs(alpha)<=EPS){ ctx.strokeStyle=CRE; ctx.lineWidth=2.4;
      for(const o of [W0,-W0]){ const x=X(o);
        ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,b.T+10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x,b.T+2); ctx.lineTo(x-5,b.T+11); ctx.lineTo(x+5,b.T+11); ctx.closePath(); ctx.fill(); } }
  }
  if(a<=EPS){ ctx.fillStyle=COSTA; ctx.font='12px system-ui'; ctx.textAlign='right';
    ctx.fillText('σ₀ = 0 está fuera de la ROC: esta señal no tiene Fourier', w-b.R-4, b.T+12); }
}

// ── lecturas ─────────────────────────────────────────────────────────
function readouts(){
  const alpha=a+s0, ok=alpha>EPS, cls = ok ? (Math.abs(s0)<0.025?'cos':'dec') : 'cre';
  const set=(id,txt)=>{ const e=$(id); e.textContent=txt; e.className='v '+cls; };
  set('rS', fmt(s0,2));
  set('rA', fmt(alpha,2));
  set('rH', ok ? fmt(1/(2*alpha), alpha<0.2?1:2) : alpha<-EPS ? '—' : '∞');
  set('rW', ok ? fmt(alpha,2) : alpha<-EPS ? '—' : '0');
  let hint;
  if(alpha<-EPS) hint='A la izquierda de los polos el amortiguamiento no alcanza: la señal roja crece y no hay nada que proyectar.';
  else if(!ok) hint='El amortiguamiento compensa justo el decaimiento propio de la señal: queda una oscilación eterna, y Fourier responde con un delta. Eso es el polo.';
  else if(Math.abs(s0)<0.025) hint='σ₀ = 0: no se amortigua nada. Esta recta es la transformada de Fourier de siempre.';
  else if(alpha<0.25) hint='Cerca de los polos: casi no queda decaimiento, y el cerro sube como 1/α y se angosta como α.';
  else hint='Cada recta vertical es una transformada de Fourier completa: la de x(t)·e^(−σ₀t). Lleva σ₀ hacia los polos.';
  $('hint').textContent=hint;
  btnModo.textContent = a>0 ? 'señal: se apaga' : 'señal: crece';
  btnPlay.textContent = playing ? '❚❚ pausar' : '▶ barrer σ₀';
  slS.value = s0;
}
function draw(){ drawS(); drawT(); drawW(); readouts(); }

// ── animación: σ₀ baja hacia los polos, espera y vuelve ───────────────
let last=0;
function tick(ts){
  if(!playing) return;
  const dt=Math.min(0.05,(ts-last)/1000); last=ts;
  if(hold>0){ hold-=dt; }
  else{
    const alpha=a+s0;
    const v = 0.12 + 0.55*Math.min(1,Math.max(0,alpha));   // frena al acercarse al polo
    s0 += dir*v*dt;
    if(dir<0 && s0 <= -a){ s0=-a; dir=1; hold=2.2; }
    if(dir>0 && s0 >= S0_MAX-0.3){ s0=S0_MAX-0.3; dir=-1; hold=0.8; }
  }
  draw(); requestAnimationFrame(tick);
}
function toggle(){ playing=!playing; if(playing){ last=performance.now(); requestAnimationFrame(tick); } readouts(); }
function setS0(v){ s0=Math.min(S0_MAX,Math.max(S0_MIN,v)); if(Math.abs(s0)<0.03) s0=0; if(Math.abs(a+s0)<0.03) s0=-a; draw(); }
function reset(){ playing=false; a=A_DEC; s0=S0_INI; dir=-1; hold=0; draw(); }

slS.min=S0_MIN; slS.max=S0_MAX; slS.step=0.01;
slS.addEventListener('input',()=>{ playing=false; setS0(parseFloat(slS.value)); });
btnPlay.addEventListener('click',toggle);
btnModo.addEventListener('click',()=>{ a = a>0 ? A_CRE : A_DEC; draw(); });
$('btnReset').addEventListener('click',reset);
cS.addEventListener('pointerdown',e=>{ dragS=true; playing=false; cS.setPointerCapture(e.pointerId);
  setS0(mapS.inv(e.clientX-cS.getBoundingClientRect().left)); });
cS.addEventListener('pointermove',e=>{ if(dragS) setS0(mapS.inv(e.clientX-cS.getBoundingClientRect().left)); });
cS.addEventListener('pointerup',()=>{ dragS=false; });
cS.addEventListener('pointercancel',()=>{ dragS=false; });
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key===' '){ e.preventDefault(); toggle(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); playing=false; setS0(s0-0.05); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); playing=false; setS0(s0+0.05); }
  else if(e.key==='m'||e.key==='M'){ a = a>0 ? A_CRE : A_DEC; draw(); }
  else if(e.key==='r'||e.key==='R'){ reset(); }
});
addEventListener('resize',draw);
draw();                                 // primer cuadro sin rAF (Chrome sin ventana no vuelve a dispararlo)
</script>
</body>
</html>
