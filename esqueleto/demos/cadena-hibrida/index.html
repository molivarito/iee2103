<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La cadena híbrida — IEE2103</title>
<style>
  :root{ --ink:#16202e; --dim:#65758b; --line:#d9e0ea; --bg:#ffffff;
         --azul:#0072B2; --rojo:#D55E00; --acc:#6042a6; --ghost:#b9c4d2; --alias:#E69F00; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;max-width:100%;overflow-x:hidden}
  body{background:var(--bg);color:var(--ink);
       font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  #app{height:100%;min-width:0;display:flex;flex-direction:column;padding:8px 14px;gap:5px;overflow:hidden}

  header{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
  .brand{font-weight:700;font-size:16px;white-space:nowrap;flex:0 0 auto}
  .brand span{font-weight:400;color:var(--dim);font-size:12px;margin-left:7px}
  .ctrls{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-width:0}
  button{font:inherit;color:var(--ink);background:#f2f5f9;border:1px solid var(--line);
         border-radius:8px;padding:5px 9px;cursor:pointer;white-space:nowrap;font-size:13px}
  button:hover{background:#e7edf5}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.primary:hover{background:#7355c0}
  button.sis{min-width:128px;background:#fff3dc;border-color:var(--alias);color:#8a5a00;font-weight:600}
  label.sl{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:12px;white-space:nowrap}
  label.sl b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;min-width:24px}
  input[type=range]{width:96px}

  .lect{display:flex;gap:16px;flex-wrap:nowrap;align-items:baseline;padding:0 2px;white-space:nowrap}
  .cel{display:flex;align-items:baseline;gap:5px}
  .cel .k{color:var(--dim);font-size:11px;letter-spacing:.02em}
  .cel .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .cel.viva .v{color:var(--rojo)}
  .cel.alia .v{color:#b07400}
  .hint{color:var(--dim);font-size:13px;text-align:center;min-height:19px;white-space:nowrap;overflow:hidden}
  .hint b{color:var(--acc)}

  #figBlk{flex:0 0 46px;height:46px}
  .wrap{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:row;gap:8px}
  figure{margin:0;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;min-width:0;min-height:0}
  #figT{flex:3 1 0;min-width:0}
  .col{flex:2 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
  #figM{flex:1 1 0} #figP{flex:1 1 0}
  figcaption{position:absolute;top:4px;left:8px;z-index:2;color:var(--dim);font-size:11.5px;
             background:rgba(255,255,255,.9);padding:1px 6px;border-radius:5px;pointer-events:none;max-width:96%}
  figcaption i{font-style:normal;font-weight:700}
  canvas{display:block;width:100%;height:100%;min-width:0;min-height:0}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">La cadena híbrida <span>IEE2103 · C22</span></div>
    <div class="ctrls">
      <button id="btnPlay" class="primary">▶</button>
      <button id="btnP2">ejemplo de clase</button>
      <button id="btnNy">f = fs/2</button>
      <button id="btnAl">con aliasing</button>
      <button id="btnSis" class="sis">h[n]: promedio</button>
      <label class="sl">f <input type="range" id="slF"><b id="vF">250</b></label>
      <label class="sl">fs <input type="range" id="slFs"><b id="vFs">1000</b></label>
      <button id="btnReset">↺</button>
    </div>
  </header>

  <div class="lect">
    <div class="cel"><span class="k">f</span><span class="v" id="rF">—</span></div>
    <div class="cel"><span class="k">fs</span><span class="v" id="rFs">—</span></div>
    <div class="cel" id="cOm"><span class="k">Ω</span><span class="v" id="rOm">—</span></div>
    <div class="cel"><span class="k">|H|</span><span class="v" id="rMag">—</span></div>
    <div class="cel"><span class="k">∠H</span><span class="v" id="rPh">—</span></div>
    <div class="cel"><span class="k">retardo</span><span class="v" id="rDel">—</span></div>
    <div class="cel viva"><span class="k">amplitud de salida</span><span class="v" id="rAmp">—</span></div>
    <div class="cel viva" id="cFo"><span class="k">f de salida</span><span class="v" id="rFo">—</span></div>
  </div>

  <figure id="figBlk"><canvas id="cB"></canvas></figure>

  <div class="wrap">
    <figure id="figT"><figcaption><i style="color:#0072B2">azul</i>: x<sub>c</sub>(t) · <i style="color:#16202e">negro</i>: x[n] · <i style="color:#D55E00">naranja</i>: y[n] y y<sub>c</sub>(t)</figcaption><canvas id="cT"></canvas></figure>
    <div class="col">
      <figure id="figM"><figcaption>|H(e<sup>jΩ</sup>)| · periódica de período 2π</figcaption><canvas id="cM"></canvas></figure>
      <figure id="figP"><figcaption>∠H(e<sup>jΩ</sup>) en unidades de π</figcaption><canvas id="cP"></canvas></figure>
    </div>
  </div>

  <div class="hint" id="hint">—</div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const cB=$('cB'), cT=$('cT'), cM=$('cM'), cP=$('cP');
const btnPlay=$('btnPlay'), btnSis=$('btnSis'), slF=$('slF'), slFs=$('slFs');
const TAU=2*Math.PI, A=4;
const AZUL='#0072B2', ROJO='#D55E00', NEGRO='#16202e';

// ── complejos mínimos: [re, im] ─────────────────────────────────────
const cexp=w=>[Math.cos(w),Math.sin(w)];
const cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]];
const cinv=a=>{ const d=a[0]*a[0]+a[1]*a[1]; return [a[0]/d,-a[1]/d]; };
const cabs=a=>Math.hypot(a[0],a[1]);
const carg=a=>Math.atan2(a[1],a[0]);

// ── los sistemas h[n] ───────────────────────────────────────────────
const SIS={
  promedio:  {nom:'promedio',        eq:'y[n] = ½x[n] + ½x[n−1]',  H:w=>cmul(cexp(-w/2),[Math.cos(w/2),0])},
  diferencia:{nom:'diferencia',      eq:'y[n] = ½x[n] − ½x[n−1]',  H:w=>cmul(cmul([0,1],cexp(-w/2)),[Math.sin(w/2),0])},
  peine:     {nom:'peine',           eq:'y[n] = x[n] − x[n−5]',    H:w=>[1-Math.cos(5*w), Math.sin(5*w)]},
  primer:    {nom:'primer orden',    eq:'y[n] = 0,8·y[n−1] + x[n]', H:w=>cinv([1-0.8*Math.cos(w), 0.8*Math.sin(w)])},
  ideal:     {nom:'pasa-bajos ideal',eq:'H = 1 si |Ω| < π/4',      H:w=>Math.abs(w)<Math.PI/4?[1,0]:[0,0]}
};
const ORDEN=['promedio','diferencia','peine','primer','ideal'];

// Ω llevada a (−π, π]
function wrap(w){
  let e=w-TAU*Math.round(w/TAU);
  if(e<=-Math.PI+1e-9) e+=TAU;
  return e;
}
const Hfun=(s,w)=>SIS[s].H(wrap(w));

// ── estado ──────────────────────────────────────────────────────────
let f=250, fs=1000, sis='promedio';
let animando=false, raf=0, animStart=0;
const SWEEP_MS=16000;

// parámetros de prueba: ?f=250 · ?fs=1000 · ?sis=promedio|diferencia|peine|primer|ideal
{
  const p=new URLSearchParams(location.search);
  if(p.has('fs')){ const v=parseFloat(p.get('fs')); if(isFinite(v)) fs=Math.max(500,Math.min(4000,v)); }
  if(p.has('f')){ const v=parseFloat(p.get('f')); if(isFinite(v)) f=Math.max(0,Math.min(fs,v)); }
  if(p.has('sis') && SIS[p.get('sis')]) sis=p.get('sis');
}

// ── el cálculo analítico de la cadena (una sola senoidal) ───────────
function calc(f,fs,s){
  const Om=TAU*f/fs, Oe=wrap(Om), H=Hfun(s,Oe), mag=cabs(H);
  const ph= mag>1e-9 ? carg(H) : 0;
  const amp=A*mag, fout=Math.abs(Oe)*fs/TAU;
  return { Om, Oe, H, mag, ph, amp, fout, dist:Math.abs(Oe-Om)>1e-9,
           yn:n=>amp*Math.cos(Oe*n+ph),               // y[n]
           yc:t=>amp*Math.cos(Oe*fs*t+ph),            // y_c(t), t en segundos
           xc:t=>A*Math.cos(TAU*f*t) };
}

// ── formato ─────────────────────────────────────────────────────────
const nf=(x,d)=>{ let s=x.toFixed(d).replace('.',','); if(+x.toFixed(d)===0) s=s.replace('-',''); return s.replace('-','−'); };
const pi=(w,d=2)=>{ const r=w/Math.PI; return Math.abs(r)<5e-4?'0':nf(r,d)+'π'; };

// ── canvas ──────────────────────────────────────────────────────────
function fit(c){
  const r=c.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr));
  if(c.width!==w||c.height!==h){ c.width=w; c.height=h; }
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  return {ctx,w:r.width,h:r.height};
}
function mapa(w,h,xmin,xmax,ymin,ymax,pad){
  const L=pad.l,R=pad.r,T=pad.t,B=pad.b;
  return { X:x=>L+(x-xmin)/(xmax-xmin)*(w-L-R), Y:y=>h-B-(y-ymin)/(ymax-ymin)*(h-T-B) };
}
function arrow2(ctx,x1,y1,x2,y2,s=6){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const ang=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-s*Math.cos(ang-0.4),y2-s*Math.sin(ang-0.4));
  ctx.lineTo(x2-s*Math.cos(ang+0.4),y2-s*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
}
function rbox(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=stroke; ctx.lineWidth=1.3; ctx.stroke();
}
function niceStep(range,target){
  const raw=range/target, mag=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/mag;
  return (m<1.5?1:m<3.5?2:m<7.5?5:10)*mag;
}

// ── diagrama de bloques ─────────────────────────────────────────────
function drawBlk(){
  const {ctx,w,h}=fit(cB), S=SIS[sis];
  const cy=h/2, bh=34, T=1000/fs;
  // posiciones: etiqueta | C/D | h[n] | D/C | etiqueta
  const lw=62, bw1=158, bw2=Math.min(300,w*0.30), bw3=84;
  const total=lw*2+bw1+bw2+bw3, gap=(w-total-24)/4;
  let x=12;
  const put=(txt,col,bold)=>{ ctx.font=(bold?'bold ':'')+'14px system-ui'; ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='middle'; };
  const seg=[];
  const xl=x; x+=lw+gap;
  const xc=x; x+=bw1+gap;
  const xh=x; x+=bw2+gap;
  const xd=x; x+=bw3+gap;
  const xr=x;
  ctx.lineWidth=1.5;
  const arr=(a,b,lab,col)=>{ ctx.strokeStyle='#65758b'; ctx.fillStyle='#65758b'; arrow2(ctx,a,cy,b,cy,6);
    ctx.font='11px system-ui'; ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(lab,(a+b)/2,cy-3); };
  ctx.font='bold 14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=AZUL; ctx.fillText('xᶜ(t)',xl+lw/2,cy);
  ctx.fillStyle=ROJO; ctx.fillText('yᶜ(t)',xr+lw/2,cy);
  arr(xl+lw+2,xc-2,'',AZUL);
  arr(xc+bw1+2,xh-2,'x[n]',NEGRO);
  arr(xh+bw2+2,xd-2,'y[n]',ROJO);
  arr(xd+bw3+2,xr-2,'',ROJO);
  // cajas
  rbox(ctx,xc,cy-bh/2,bw1,bh,7,'#e8f2fa',AZUL);
  ctx.fillStyle=NEGRO; ctx.font='bold 13px system-ui'; ctx.textBaseline='alphabetic';
  ctx.fillText('C/D',xc+bw1/2,cy-3);
  ctx.font='11px system-ui'; ctx.fillStyle='#65758b'; ctx.textBaseline='top';
  ctx.fillText('T = '+nf(T,T<1?2:1)+' ms · fs = '+Math.round(fs),xc+bw1/2,cy);
  rbox(ctx,xh,cy-bh/2,bw2,bh,7,'#fff3dc',ALIAS_C);
  ctx.fillStyle=NEGRO; ctx.font='bold 13px system-ui'; ctx.textBaseline='alphabetic';
  ctx.fillText('h[n]: '+S.nom,xh+bw2/2,cy-3);
  ctx.font='11px system-ui'; ctx.fillStyle='#65758b'; ctx.textBaseline='top';
  ctx.fillText(S.eq,xh+bw2/2,cy);
  rbox(ctx,xd,cy-bh/2,bw3,bh,7,'#fdeee3',ROJO);
  ctx.fillStyle=NEGRO; ctx.font='bold 13px system-ui'; ctx.textBaseline='alphabetic';
  ctx.fillText('D/C',xd+bw3/2,cy-3);
  ctx.font='11px system-ui'; ctx.fillStyle='#65758b'; ctx.textBaseline='top';
  ctx.fillText('ideal',xd+bw3/2,cy);
}
const ALIAS_C='#E69F00';

// ── panel de tiempo ─────────────────────────────────────────────────
function drawTime(){
  const {ctx,w,h}=fit(cT), R=calc(f,fs,sis);
  const Tms=1000/fs;
  const Tw=Math.min(40,Math.max(20, f>0?4000/f:0));       // ms
  const ymax=Math.max(A,R.amp)*1.12;
  const M=mapa(w,h,0,Tw,-ymax,ymax,{l:38,r:12,t:26,b:24});
  const y0=M.Y(0);
  // rejilla y ejes
  ctx.font='11px system-ui'; ctx.fillStyle='#8a97a8'; ctx.textBaseline='top'; ctx.textAlign='center';
  const sx=niceStep(Tw,8);
  ctx.strokeStyle='#eef2f7'; ctx.lineWidth=1;
  for(let t=0;t<=Tw+1e-9;t+=sx){ ctx.beginPath(); ctx.moveTo(M.X(t),M.Y(ymax)); ctx.lineTo(M.X(t),M.Y(-ymax)); ctx.stroke(); }
  ctx.strokeStyle='#c9d3e0';
  ctx.beginPath(); ctx.moveTo(M.X(0),y0); ctx.lineTo(M.X(Tw),y0); ctx.stroke();
  let tl=0; for(let t=0;t<=Tw+1e-9;t+=sx) tl=t;
  for(let t=0;t<=Tw+1e-9;t+=sx){ ctx.textAlign= t===tl&&Math.abs(tl-Tw)<1e-9?'right':'center'; ctx.fillText(nf(t,sx<1?1:0)+(t===tl?' ms':''),M.X(t)+(t===tl&&Math.abs(tl-Tw)<1e-9?6:0),M.Y(-ymax)+4); }
  ctx.textBaseline='middle';
  const sy=niceStep(ymax,3);
  for(let v=-Math.floor(ymax/sy)*sy; v<=ymax+1e-9; v+=sy){
    ctx.strokeStyle='#eef2f7'; ctx.beginPath(); ctx.moveTo(M.X(0),M.Y(v)); ctx.lineTo(M.X(Tw),M.Y(v)); ctx.stroke();
    ctx.fillStyle='#8a97a8'; ctx.textAlign='right'; ctx.fillText(nf(v,0),M.X(0)-4,M.Y(v));
  }
  ctx.strokeStyle='#c9d3e0'; ctx.beginPath(); ctx.moveTo(M.X(0),M.Y(ymax)); ctx.lineTo(M.X(0),M.Y(-ymax)); ctx.stroke();

  const curva=(fn,color,lw)=>{
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath();
    const N=Math.max(600,Math.round(w*1.5));
    for(let i=0;i<=N;i++){ const t=Tw*i/N, x=M.X(t), y=M.Y(fn(t*1e-3)); i? ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
  };
  curva(R.xc,'rgba(0,114,178,0.85)',1.8);
  curva(R.yc,'rgba(213,94,0,0.9)',1.8);

  // muestras
  const nmax=Math.floor(Tw/Tms+1e-9), r=nmax>60?2.4:3.4, lwS=nmax>60?1.2:1.8;
  for(let n=0;n<=nmax;n++){
    const x=M.X(n*Tms), yi=M.Y(R.xc(n*Tms*1e-3)), yo=M.Y(R.yn(n));
    ctx.strokeStyle='rgba(22,32,46,0.55)'; ctx.lineWidth=lwS; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,yi); ctx.stroke();
    ctx.strokeStyle=ROJO; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,yo); ctx.stroke();
  }
  for(let n=0;n<=nmax;n++){
    const x=M.X(n*Tms);
    ctx.fillStyle=NEGRO; ctx.beginPath(); ctx.arc(x,M.Y(R.xc(n*Tms*1e-3)),r,0,7); ctx.fill();
    ctx.fillStyle=ROJO; ctx.beginPath(); ctx.arc(x,M.Y(R.yn(n)),r,0,7); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=0.8; ctx.stroke();
  }
}

// ── paneles de frecuencia ───────────────────────────────────────────
const XM=TAU;                                    // eje: Ω ∈ [−2π, 2π]
function ejeFrec(ctx,M,h,conRotulos,w,padB){
  // zonas fuera de (−π, π]: tenues
  ctx.fillStyle='rgba(230,159,0,0.07)';
  const top=M.Y(M.ymax), bot=M.Y(M.ymin);
  ctx.fillRect(M.X(-XM),top,M.X(-Math.PI)-M.X(-XM),bot-top);
  ctx.fillRect(M.X(Math.PI),top,M.X(XM)-M.X(Math.PI),bot-top);
  // verticales en múltiplos de π
  for(let k=-2;k<=2;k++){
    const x=M.X(k*Math.PI), esNy=Math.abs(k)===1;
    ctx.strokeStyle= esNy?'#9aa7b8':'#e3e9f1'; ctx.lineWidth=1; ctx.setLineDash(esNy?[4,3]:[]);
    ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bot); ctx.stroke(); ctx.setLineDash([]);
  }
  if(conRotulos){
    ctx.font='11px system-ui'; ctx.textBaseline='top'; ctx.textAlign='center';
    const yb=bot+3;
    for(let k=-2;k<=2;k++){
      const x=M.X(k*Math.PI);
      ctx.fillStyle='#65758b';
      ctx.fillText(k===0?'0':(k<0?'−':'')+(Math.abs(k)===1?'':Math.abs(k))+'π',x,yb);
      ctx.fillStyle='#b07400';
      ctx.fillText(nf(k*fs/2,0)+' Hz',x,yb+13);
    }
  }
}
function marcas(ctx,M,R,yOm,yOe){
  const xa=M.X(R.Om), xe=M.X(R.Oe);
  if(R.dist){
    // flecha del regreso de 2π, un poco sobre la curva
    const ya=M.Y(yOm)-11;
    ctx.strokeStyle='rgba(176,116,0,0.9)'; ctx.fillStyle='rgba(176,116,0,0.9)'; ctx.lineWidth=1.4; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(xa,M.Y(yOm)); ctx.lineTo(xa,ya); ctx.lineTo(xe,ya); ctx.lineTo(xe,M.Y(yOe)-3); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); const yt=M.Y(yOe)-3; ctx.moveTo(xe,yt); ctx.lineTo(xe-4,yt-7); ctx.lineTo(xe+4,yt-7); ctx.closePath(); ctx.fill();
    ctx.fillStyle=ALIAS_C; ctx.beginPath(); ctx.arc(xe,M.Y(yOe),5,0,7); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.fillStyle=AZUL; ctx.beginPath(); ctx.arc(xa,M.Y(yOm),5,0,7); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
}
function drawMag(){
  const {ctx,w,h}=fit(cM), R=calc(f,fs,sis);
  // máximo de |H| en la rejilla
  let mx=0; for(let i=0;i<=400;i++){ mx=Math.max(mx,cabs(Hfun(sis,-XM+XM*2*i/400))); }
  const ymax=Math.max(1.2,mx*1.2);
  const M=mapa(w,h,-XM,XM,0,ymax,{l:36,r:24,t:24,b:8});
  M.ymax=ymax; M.ymin=0;
  ejeFrec(ctx,M,h,false,w);
  ctx.strokeStyle='#c9d3e0'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(M.X(-XM),M.Y(0)); ctx.lineTo(M.X(XM),M.Y(0)); ctx.stroke();
  // rótulo del Nyquist
  ctx.font='11px system-ui'; ctx.fillStyle='#65758b'; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.textAlign='left'; ctx.fillText('π = fs/2',M.X(Math.PI)+4,M.Y(ymax)+1); ctx.fillText('−π',M.X(-Math.PI)+4,M.Y(ymax)+1);
  ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillStyle='#8a97a8';
  const sy=niceStep(ymax,3);
  for(let v=0;v<=ymax;v+=sy){ ctx.fillText(nf(v,sy<1?1:0),M.X(-XM)-4,M.Y(v)); }
  // curva
  ctx.strokeStyle=NEGRO; ctx.lineWidth=1.8; ctx.beginPath();
  const N=1200;
  for(let i=0;i<=N;i++){ const wv=-XM+XM*2*i/N, m=cabs(Hfun(sis,wv)); const x=M.X(wv), y=M.Y(m); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.stroke();
  marcas(ctx,M,R,R.mag,R.mag);
}
function drawPh(){
  const {ctx,w,h}=fit(cP), R=calc(f,fs,sis);
  const M=mapa(w,h,-XM,XM,-1.15,1.15,{l:36,r:24,t:22,b:34});
  M.ymax=1.15; M.ymin=-1.15;
  ejeFrec(ctx,M,h,true,w);
  ctx.strokeStyle='#c9d3e0'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(M.X(-XM),M.Y(0)); ctx.lineTo(M.X(XM),M.Y(0)); ctx.stroke();
  ctx.font='11px system-ui'; ctx.fillStyle='#8a97a8'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const v of [-1,0,1]) ctx.fillText(v===0?'0':(v<0?'−':'')+'π',M.X(-XM)-4,M.Y(v));
  // fase: sin unir los saltos ni los puntos donde |H| = 0
  ctx.strokeStyle=NEGRO; ctx.lineWidth=1.8; ctx.beginPath();
  const N=1600; let prev=null;
  for(let i=0;i<=N;i++){
    const wv=-XM+XM*2*i/N, H=Hfun(sis,wv);
    if(cabs(H)<1e-6){ prev=null; continue; }
    const p=carg(H)/Math.PI, x=M.X(wv), y=M.Y(p);
    if(prev===null || Math.abs(p-prev)>1.0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    prev=p;
  }
  ctx.stroke();
  if(R.mag>1e-9) marcas(ctx,M,R,R.ph/Math.PI,R.ph/Math.PI);
}

// ── lecturas y pie ──────────────────────────────────────────────────
function lectura(){
  const R=calc(f,fs,sis), nul=R.mag<1e-9;
  $('rF').textContent=Math.round(f)+' Hz';
  $('rFs').textContent=Math.round(fs)+' Hz';
  $('rOm').textContent= R.dist ? pi(R.Om)+' → '+pi(R.Oe) : pi(R.Om);
  $('cOm').className='cel'+(R.dist?' alia':'');
  $('rMag').textContent=nf(R.mag,3);
  $('rPh').textContent= nul ? '—' : pi(R.ph);
  // retardo de la senoidal de salida: cos(|Ωe| fs t + s·∠H) ⇒ retardo = −s·∠H / (2π f_out)
  const fo=R.fout;
  if(nul || fo<1e-6) $('rDel').textContent='—';
  else { const s=R.Oe<0?-1:1; $('rDel').textContent=nf(-s*R.ph/(TAU*fo)*1000,2)+' ms'; }
  $('rAmp').textContent=nf(R.amp,2);
  $('rFo').textContent= nul ? '—' : nf(fo,Math.abs(fo-Math.round(fo))<1e-6?0:1)+' Hz';
  $('cFo').className='cel '+(R.dist&&!nul?'alia':'viva');
  let t;
  if(f>fs/2+1e-9){
    t='La entrada cruzó fs/2: el C/D la disfraza de fs − f = <b>'+nf(fs-f,0)+' Hz</b> y la cadena responde a esa frecuencia, no a la original';
  } else if(Math.abs(f-fs/2)<1e-9){
    t='<b>Justo en Nyquist</b>: Ω = π, hay dos muestras por ciclo; un paso más y el C/D la confunde con otra';
  } else {
    t='Sin aliasing la cadena es un filtro continuo: H<sub>ef</sub>(ω) = H(e<sup>jωT</sup>); '+
      (nul?'salida nula a '+nf(f,0)+' Hz':'salida de <b>'+nf(R.amp,2)+'</b> a <b>'+nf(f,0)+' Hz</b> con fase <b>'+pi(R.ph)+'</b>');
  }
  $('hint').innerHTML=t;
  $('vF').textContent=Math.round(f); $('vFs').textContent=Math.round(fs);
  btnSis.textContent='h[n]: '+SIS[sis].nom;
}
function pinta(){ drawBlk(); drawTime(); drawMag(); drawPh(); lectura(); }

// ── controles ───────────────────────────────────────────────────────
function ponSliders(){ slF.max=fs; slF.value=f; slFs.value=fs; }
function setF(v){ f=Math.max(0,Math.min(fs,v)); slF.value=f; pinta(); }
function irA(nf_,nfs,ns){ detener(); if(nfs!==undefined) fs=nfs; if(ns) sis=ns; slF.max=fs; slFs.value=fs; f=Math.min(nf_,fs); slF.value=f; pinta(); }
function animFrame(ts){
  if(!animando) return;
  const el=(ts-animStart)%SWEEP_MS;
  f=Math.round(el/SWEEP_MS*fs); slF.value=f; pinta();
  raf=requestAnimationFrame(animFrame);
}
function detener(){ animando=false; cancelAnimationFrame(raf); btnPlay.textContent='▶'; }
function toggle(){
  animando=!animando;
  btnPlay.textContent= animando ? '⏸' : '▶';
  if(animando){ animStart=performance.now()-(f/fs)*SWEEP_MS; raf=requestAnimationFrame(animFrame); }
  else cancelAnimationFrame(raf);
}
function ciclaSis(){ sis=ORDEN[(ORDEN.indexOf(sis)+1)%ORDEN.length]; pinta(); }
function resetAll(){ irA(250,1000,'promedio'); }

slF.min=0; slF.step=5; slFs.min=500; slFs.max=4000; slFs.step=100;
ponSliders();
btnPlay.onclick=toggle;
$('btnReset').onclick=resetAll;
$('btnP2').onclick=()=>irA(250,1000,'promedio');
$('btnNy').onclick=()=>irA(fs/2);
$('btnAl').onclick=()=>irA(750,1000);
btnSis.onclick=ciclaSis;
slF.oninput=e=>{ detener(); f=+e.target.value; pinta(); };
slFs.oninput=e=>{ detener(); fs=+e.target.value; slF.max=fs; f=Math.min(f,fs); slF.value=f; pinta(); };

// dentro de reveal.js: cualquier toque en la demo le da el foco al iframe,
// para que las teclas lleguen aquí y no cambien de lámina
document.addEventListener('pointerdown', ()=>window.focus(), true);

document.addEventListener('keydown', e=>{
  if(e.target && e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); e.stopPropagation(); toggle(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); e.stopPropagation(); detener(); setF(f+5); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); e.stopPropagation(); detener(); setF(f-5); }
  else if(e.key==='m'||e.key==='M'){ e.stopPropagation(); ciclaSis(); }
  else if(e.key==='r'||e.key==='R'){ e.stopPropagation(); resetAll(); }
});

{ const ro=new ResizeObserver(()=>pinta()); for(const g of document.querySelectorAll('figure')) ro.observe(g); ro.observe(document.body); }
pinta();   // primer cuadro sin depender de requestAnimationFrame
</script>
